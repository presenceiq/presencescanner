// --- Name-mismatch detector (Fix #8) ---
// Returns true when the business name the owner TYPED has no meaningful
// words in common with the name on the Google listing we matched. Used
// to warn the owner before they confirm the wrong listing — common when
// two businesses share a phone number (entity conflation).
function namesLookDifferent(typed, matched){
  if(!typed||!matched)return false;
  const stop=new Set(["the","of","and","for","llc","inc","co","corp","company","ltd","group","services","service","fl","florida","usa","us"]);
  const toks=s=>s.toLowerCase().replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(w=>w.length>=3&&!stop.has(w));
  const t=new Set(toks(typed));
  const m=new Set(toks(matched));
  if(t.size===0||m.size===0)return false;
  for(const w of t){if(m.has(w))return false;}
  return true;
}

// --- Google URL identifier extractor (Venice-Italy bug fix) ---
// Pulls a real Place ID out of a pasted Google URL when one is present.
// Most Google share links DO NOT include a Place ID (they use Knowledge
// Graph IDs or data IDs instead, which can't be deterministically converted
// to a Place ID). When no Place ID is found we refuse to scan that URL
// and route the user to the manual paste path instead — that's what
// prevents the tool from falling back to a text search and returning the
// wrong country / wrong business.
function extractGoogleUrlIds(url){
  if(!url)return{placeId:null,bizName:null};
  let d=url;
  try{d=decodeURIComponent(url);}catch{}
  const placeId =
    d.match(/place_id:([A-Za-z0-9_-]+)/)?.[1] ||
    d.match(/[?&]query_place_id=([^&]+)/)?.[1] ||
    d.match(/[?&]placeid=([A-Za-z0-9_-]+)/)?.[1] ||
    null;
  // Try to recover the business name from the URL so we can pre-fill the
  // manual paste form when the link itself isn't usable. Two common spots:
  // ?q=Business+Name  and  /maps/place/Business+Name/...
  let bizName = null;
  const q = d.match(/[?&]q=([^&]+)/)?.[1];
  if(q){
    bizName = q.replace(/\+/g," ").trim();
  } else {
    const pm = d.match(/\/maps\/place\/([^\/\?]+)/);
    if(pm) bizName = pm[1].replace(/\+/g," ").replace(/-/g," ").trim();
  }
  return {placeId, bizName};
}

// --- Google Place Autocomplete widget, wrapped as a React component ---
// Mounts Google's autocomplete on an input. When the user picks a
// business from the dropdown, calls onPick with {placeId, name, address}.
function BusinessAutocomplete({ onPick }) {
  const inputRef = useRef(null);
  const mountedRef = useRef(false);
  const [status, setStatus] = useState("loading"); // loading | ready | failed

  useEffect(() => {
    // Wait for Google's library to be available, then mount once.
    let tries = 0;
    const tryMount = () => {
      if (mountedRef.current) return;
      if (window.google && window.google.maps && window.google.maps.places && inputRef.current) {
        mountedRef.current = true;
        const ac = new window.google.maps.places.Autocomplete(inputRef.current, {
          types: ["establishment"],
          fields: ["place_id", "name", "formatted_address"],
          // Fix #4 — bias predictions toward Florida so local businesses
          // rank higher and stop dropping off the list as the owner types.
          // Soft bias (strictBounds:false by default) — businesses outside
          // Florida still appear if the owner types them clearly.
          bounds: new window.google.maps.LatLngBounds(
            new window.google.maps.LatLng(24.396308, -87.634938),
            new window.google.maps.LatLng(31.000888, -79.974306)
          ),
        });
        ac.addListener("place_changed", () => {
          const place = ac.getPlace();
          if (place && place.place_id) {
            onPick({
              placeId: place.place_id,
              name: place.name || "",
              address: place.formatted_address || "",
            });
          }
        });
        setStatus("ready");
        return;
      }
      tries++;
      if (tries > 40) { setStatus("failed"); return; } // ~10s of waiting
      setTimeout(tryMount, 250);
    };
    tryMount();
  }, []);

  return (
    <div>
      <input ref={inputRef} type="text"
        placeholder="Start typing your business name..."
        style={{width:"100%",padding:"12px 14px",fontSize:"1rem",
          border:"1px solid rgba(255,255,255,0.2)",borderRadius:8,
          background:"rgba(0,0,0,0.04)",color:"inherit",boxSizing:"border-box"}} />
      {status==="failed" && (
        <div className="err" style={{marginTop:8,fontSize:"0.85rem"}}>
          The business search could not load. Please use one of the options below instead.
        </div>
      )}
    </div>
  );
}

// --- Bug report widget (Fix #5) + sentiment-pulse handler (Fix #6) ---
// Renders the persistent "Something off?" button AND the feedback modal.
// The modal is now controlled from App so the sentiment-pulse strip can
// also open it. When `mood` is non-null the modal copy adjusts to match
// the user's emotional state (😐 okay / 😞 frustrating).
function BugReport({open,setOpen,mood,setMood,onSubmitted}){
  const [showHowto,setShowHowto]=useState(false);
  const [text,setText]=useState("");
  const [file,setFile]=useState(null);
  const [email,setEmail]=useState("");
  const [state,setState]=useState("idle"); // idle | sending | sent | error
  const [errMsg,setErrMsg]=useState("");

  // Copy varies depending on what triggered the modal.
  const copy = mood==="frustrating" ? {
    title:"Sorry that was frustrating",
    intro:"I want to fix this. Tell me what felt frustrating and I'll work on it — quick and casual is fine.",
    msgLabel:"What's frustrating?",
    placeholder:"Tell me what felt wrong or annoying…"
  } : mood==="okay" ? {
    title:"Tell me what's missing",
    intro:"You're testing this with me — that's the help I need. What felt incomplete, off, or could be better? Quick and casual is fine.",
    msgLabel:"What's missing or could be better?",
    placeholder:"Tell me what felt incomplete or could be improved…"
  } : {
    title:"Spotted something off?",
    intro:"You're testing this with me — that's the help I need. Tell me what looked wrong, weird, or confusing, and I'll fix it. Quick and casual is fine.",
    msgLabel:"What happened?",
    placeholder:"Just describe it in your own words…"
  };

  function close(){
    setOpen(false);
    // Clear the form state shortly after the modal closes so it's fresh
    // next time the link is clicked.
    setTimeout(()=>{
      setText("");setFile(null);setEmail("");
      setState("idle");setErrMsg("");
      if(setMood)setMood(null);
    },200);
  }

  async function submit(){
    if(!text.trim()){
      setErrMsg("Please tell me a little about it.");
      setState("error");
      return;
    }
    setState("sending");setErrMsg("");
    try{
      const fd=new FormData();
      fd.append("message",text.trim());
      fd.append("mood",mood||"bug-report");
      if(email.trim())fd.append("email",email.trim());
      if(file)fd.append("screenshot",file);
      fd.append("page_url",window.location.href);
      fd.append("user_agent",navigator.userAgent);
      const res=await fetch("https://formspree.io/f/"+BUG_REPORT_FORMSPREE_ID,{
        method:"POST",body:fd,headers:{"Accept":"application/json"}
      });
      if(res.ok){
        setState("sent");
        if(onSubmitted)onSubmitted(mood);
        setTimeout(close,2500);
      }else{
        const d=await res.json().catch(()=>({}));
        setErrMsg((d&&d.error)||"Couldn't send. Please try again.");
        setState("error");
      }
    }catch(e){
      setErrMsg("Couldn't send. Check your internet and try again.");
      setState("error");
    }
  }

  return (
    <>
      <button className="bug-link" onClick={()=>{if(setMood)setMood(null);setOpen(true);}} title="Report something off">
        Something off?
        <span className="bug-link-beta">BETA</span>
      </button>
      {open && (
        <div className="bug-backdrop" onClick={close}>
          <div className="bug-modal" onClick={e=>e.stopPropagation()}>
            {state==="sent" ? (
              <div className="bug-thanks">
                <div className="bug-thanks-mark">✓</div>
                <h3>Thanks — got it.</h3>
                <p>I'll take a look.</p>
              </div>
            ) : (
              <>
                <button className="bug-close" onClick={close} aria-label="Close">×</button>
                <h3>{copy.title}</h3>
                <p>{copy.intro}</p>
                <label>{copy.msgLabel}</label>
                <textarea value={text} onChange={e=>setText(e.target.value)}
                  placeholder={copy.placeholder}
                  disabled={state==="sending"} />
                <label>Screenshot (optional but encouraged)</label>
                <div className="bug-file-wrap">
                  <input type="file" accept="image/*" id="bug-file"
                    onChange={e=>setFile(e.target.files[0]||null)}
                    disabled={state==="sending"} />
                  <label htmlFor="bug-file" className="bug-file-btn">
                    {file ? `📎 ${file.name}` : "📸 Choose a screenshot…"}
                  </label>
                  {file && <button type="button" className="bug-file-clear" onClick={()=>setFile(null)}>Remove</button>}
                </div>
                <button type="button" className="bug-howto-btn" onClick={()=>setShowHowto(true)}>
                  How do I take a screenshot?
                </button>
                <label>Your email (optional, only if you want a reply)</label>
                <input type="email" value={email} onChange={e=>setEmail(e.target.value)}
                  placeholder="your@email.com"
                  disabled={state==="sending"} />
                {state==="error" && <div className="bug-err">{errMsg}</div>}
                <button className="bug-send" onClick={submit}
                  disabled={state==="sending"||!text.trim()}>
                  {state==="sending" ? "Sending…" : "Send it"}
                </button>
              </>
            )}
          </div>
        </div>
      )}
      {showHowto && (
        <div className="bug-howto-backdrop" onClick={()=>setShowHowto(false)}>
          <div className="bug-howto-modal" onClick={e=>e.stopPropagation()}>
            <button className="bug-close" onClick={()=>setShowHowto(false)} aria-label="Close">×</button>
            <h3>How to take a screenshot</h3>
            <div className="bug-howto-section">
              <div className="bug-howto-platform">📱 iPhone</div>
              <div className="bug-howto-steps">Press the <b>Side button</b> + <b>Volume Up</b> at the same time. The screenshot saves to your Photos.</div>
            </div>
            <div className="bug-howto-section">
              <div className="bug-howto-platform">📱 Android phone</div>
              <div className="bug-howto-steps">Press the <b>Power button</b> + <b>Volume Down</b> at the same time. The screenshot saves to your Gallery.</div>
            </div>
            <div className="bug-howto-section">
              <div className="bug-howto-platform">🖥️ Windows computer</div>
              <div className="bug-howto-steps">Press <b>Windows key + Shift + S</b>, drag to select what to capture. The screenshot copies to your clipboard — paste it into a Word doc or email to save it.</div>
            </div>
            <div className="bug-howto-section">
              <div className="bug-howto-platform">🖥️ Mac computer</div>
              <div className="bug-howto-steps">Press <b>⌘ + Shift + 4</b>, drag to select what to capture. The screenshot saves to your Desktop.</div>
            </div>
            <p className="bug-howto-tip">Once you have the screenshot saved, close this and tap "Choose a screenshot…" to find it.</p>
          </div>
        </div>
      )}
    </>
  );
}

// --- Sentiment pulse strip (Fix #6) ---
// Three-emoji mood read at the bottom of the results page.
//   😀 Good        → silent quick vote to Formspree, strip becomes "Thanks!"
//   😐 Okay        → opens the bug-report modal with mood="okay"
//   😞 Frustrating → opens the bug-report modal with mood="frustrating"
// Both negative paths use the same modal — same screenshot field, same
// "How do I take a screenshot?" instructions — just with copy adjusted
// to match the mood. One vote per scan session; resets on new scan.
function SentimentStrip({onTextFeedback,voted,setVoted}){
  async function quickVote(){
    setVoted(true);
    try{
      const fd=new FormData();
      fd.append("mood","good");
      fd.append("message","[quick mood vote: 😀 Good]");
      fd.append("page_url",window.location.href);
      await fetch("https://formspree.io/f/"+BUG_REPORT_FORMSPREE_ID,{
        method:"POST",body:fd,headers:{"Accept":"application/json"}
      });
    }catch{}
  }

  function chooseMood(m){
    if(m==="good"){
      // The tap is the feedback — submit immediately and confirm.
      quickVote();
    }else{
      // For 😐 / 😞, opening the modal is NOT yet a vote. Strip stays
      // unchanged until the user actually submits. If they close the
      // modal without submitting, they can vote again.
      onTextFeedback(m);
    }
  }

  if(voted){
    return (
      <div className="mood-strip">
        <div className="mood-thanks">Thanks for the feedback!</div>
      </div>
    );
  }

  return (
    <div className="mood-strip">
      <div className="mood-question">How are you finding PresenceScanner so far?</div>
      <div className="mood-buttons">
        <button className="mood-btn" onClick={()=>chooseMood("good")} title="Good">
          <span className="mood-emoji">😀</span>
          <span className="mood-label">Good</span>
        </button>
        <button className="mood-btn" onClick={()=>chooseMood("okay")} title="Okay">
          <span className="mood-emoji">😐</span>
          <span className="mood-label">Okay</span>
        </button>
        <button className="mood-btn" onClick={()=>chooseMood("frustrating")} title="Frustrating">
          <span className="mood-emoji">😞</span>
          <span className="mood-label">Frustrating</span>
        </button>
      </div>
    </div>
  );
}

function App(){
  const [view,setView]=useState("form");
  const [bizName,setBizName]=useState("");
  const [website,setWebsite]=useState("");
  const [city,setCity]=useState("");
  const [phone,setPhone]=useState("");
  const [email,setEmail]=useState("");
  const [stepIdx,setStepIdx]=useState(0);
  const [results,setResults]=useState(null);
  const [pendingMatch,setPendingMatch]=useState(null);
  const [errMsg,setErrMsg]=useState("");
  // --- Phone-first match confirmation (self-contained) ---
  const [phoneMatch,setPhoneMatch]=useState(null);
  // --- "Help us find your business" step (self-contained) ---
  const [fhName,setFhName]=useState("");
  const [fhAddress,setFhAddress]=useState("");
  const [fhPhone,setFhPhone]=useState("");
  const [fhMapsUrl,setFhMapsUrl]=useState("");
  const [fhErr,setFhErr]=useState("");
  // --- Expanded "Copy from your Google Business Profile" fields ---
  // Optional copy/paste fields the user can fill in from their GBP
  // dashboard so the scan has real data to score against. Only Name is
  // required; the rest sharpen the report when provided.
  const [fhWebsite,setFhWebsite]=useState("");
  const [fhRating,setFhRating]=useState("");
  const [fhReviewCount,setFhReviewCount]=useState("");
  const [fhHasHours,setFhHasHours]=useState(false);
  const [fhCategory,setFhCategory]=useState("");
  // --- Feedback modal (controls BugReport from outside so SentimentStrip
  // can also open it with a mood context) ---
  const [bugOpen,setBugOpen]=useState(false);
  const [bugMood,setBugMood]=useState(null);
  // --- Sentiment pulse vote (one per scan session, resets on new scan) ---
  const [moodVoted,setMoodVoted]=useState(false);

  // Triggered when the sentiment strip's 😐 or 😞 is clicked.
  function requestFeedback(mood){
    setBugMood(mood);
    setBugOpen(true);
  }

  useEffect(()=>{
    if(view!=="loading")return;
    let i=0;
    const iv=setInterval(()=>{i++;setStepIdx(i);if(i>=STEPS.length)clearInterval(iv);},750);
    return()=>clearInterval(iv);
  },[view]);

  // When results load, jump to the top so the user sees the score first
  // (not partway down the page at the AI advisor). Finding #2 fix.
  useEffect(()=>{
    if(view==="results"){window.scrollTo(0,0);}
  },[view]);

  async function handleScan(){
    if(!bizName.trim()||!city.trim())return;
    setView("loading");setStepIdx(0);
    if(email.trim()){
      fetch("/api/subscribe",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email.trim()})}).catch(()=>{});
    }
    try{
      // STEP 1 (Carl's flow): phone-first lookup. Phone numbers are far
      // more unique than business names, so try this before anything else.
      if(phone&&phone.trim()){
        const pRes=await fetch("/api/findplace",{
          method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({phone:phone.trim()})
        });
        const pData=await pRes.json();
        if(pData&&pData.found){
          // Found a business by phone. Show it and let the owner confirm.
          setPhoneMatch(pData);
          setView("phoneconfirm");
          return;
        }
      }
      // No phone match (or no phone given) — fall through to the
      // existing name-search flow (pick-a-list / findhelp).
      const result=await getCandidates(bizName,city,phone,website);
      if(result&&result.found&&result.candidates&&result.candidates.length>0){
        setPendingMatch(result.candidates);
        setView("pick");
        return;
      }
      // Google's search found nothing. Don't scan blind — send the user
      // to the "help us find your business" screen.
      pickNone();
      return;
    }catch(e){setErrMsg(e.message);setView("error");}
  }

  // --- Phone-match confirmation handlers (self-contained) ---
  // Owner confirmed the phone-matched business is theirs — scan it.
  async function phoneConfirmYes(){
    setView("loading");setStepIdx(0);
    try{
      // Use the listing's name so the report title, advisor, and findings
      // all describe the SAME business (instead of the typed name on the
      // title and the listing's name in the findings).
      const realName=phoneMatch.name||bizName;
      if(realName)setBizName(realName);
      // Use the website from the phone-matched Google listing. The form
      // field may be blank; the matched listing is the real business.
      const data=await runScan(realName,phoneMatch.website||website,city,phone,phoneMatch);
      setResults(data);setView("results");
    }catch(e){setErrMsg(e.message);setView("error");}
  }

  // Owner said the phone-matched business is NOT theirs — fall through
  // to the existing name-search flow so they can find the right one.
  async function phoneConfirmNo(){
    setView("loading");setStepIdx(0);
    try{
      const result=await getCandidates(bizName,city,phone,website);
      if(result&&result.found&&result.candidates&&result.candidates.length>0){
        setPendingMatch(result.candidates);
        setView("pick");
        return;
      }
      pickNone();
    }catch(e){setErrMsg(e.message);setView("error");}
  }

  // User picked a business from the list — scan that one.
  async function pickBusiness(chosen){
    setView("loading");setStepIdx(0);
    try{
      // Use the chosen listing's name and website (not the typed form
      // values) so the report consistently describes that business.
      const realName=chosen.name||bizName;
      const realWebsite=chosen.website||website;
      if(realName)setBizName(realName);
      const data=await runScan(realName,realWebsite,city,phone,chosen);
      setResults(data);setView("results");
    }catch(e){setErrMsg(e.message);setView("error");}
  }

  // User said none of the listed businesses are theirs.
  // Instead of scanning blind, take them to the "help us find your business" step.
  function pickNone(){
    // Pre-fill the name field with what they already typed, as a convenience.
    setFhName(bizName||"");
    setFhAddress("");
    setFhPhone(phone||"");
    setView("findhelp");
  }

  // --- "Help us find your business" step handlers (self-contained) ---

  // BEST PATH: the user pasted their Google Maps link. We send it to
  // resolveplace.js, which reads the business ID out of the link and
  // fetches the REAL listing — real reviews, photos, hours.
  // BEST PATH: the user picked their business from the autocomplete
  // widget. We have the exact Google place_id — fetch that exact
  // business and scan it. No guessing, no wrong business.
  async function findHelpFromWidget(picked){
    if(!picked||!picked.placeId)return;
    setFhErr("");
    setView("loading");setStepIdx(0);
    try{
      const res=await fetch("/api/resolveplace",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({placeId:picked.placeId})
      });
      const gbp=await res.json();
      if(gbp&&gbp.found){
        // Use the PICKED business's own name and website — not the
        // stale form fields. The form may have a made-up name or a
        // blank website; the picked business is the real one.
        const realName=gbp.name||picked.name||bizName;
        const realWebsite=gbp.website||"";
        // Update the displayed business name so the report title,
        // loading screen, and AI advisor all show the picked business.
        if(realName)setBizName(realName);
        const data=await runScan(realName,realWebsite,city,phone,gbp);
        setResults(data);setView("results");
      }else{
        setFhErr((gbp&&gbp.message)||"We couldn't load that business. Please try again or use another option below.");
        setView("findhelp");
      }
    }catch(e){
      setFhErr("Something went wrong loading that business. Please try again.");
      setView("findhelp");
    }
  }

  async function findHelpFromLink(){
    if(!fhMapsUrl.trim())return;
    setFhErr("");
    // Venice-Italy bug fix: most pasted Google URLs do NOT include a usable
    // Place ID — they carry Knowledge Graph IDs (kgmid) or data IDs that
    // can't be deterministically converted. If we send those to the server
    // it falls back to a text search, which has been returning the wrong
    // country / wrong business. Refuse early here and offer the manual
    // paste path as the reliable alternative.
    const url=fhMapsUrl.trim();
    const ids=extractGoogleUrlIds(url);
    if(!ids.placeId){
      // Pre-fill the manual form with the business name from the URL if we
      // could find one, so the user doesn't have to retype it.
      if(ids.bizName && !fhName) setFhName(ids.bizName);
      setFhErr("This Google link doesn't include a Place ID we can use — that's normal for Share links. Use the \"Copy from your Google Business Profile\" option below instead — we've pre-filled what we could read from the link.");
      setFhMapsUrl("");
      return;
    }
    setView("loading");setStepIdx(0);
    try{
      const res=await fetch("/api/resolveplace",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({placeId:ids.placeId})
      });
      const gbp=await res.json();
      if(gbp&&gbp.found){
        // Use the resolved listing's name and website, not the typed form
        // values, so the report consistently describes that business.
        const realName=gbp.name||bizName;
        if(realName)setBizName(realName);
        const data=await runScan(realName,gbp.website||website,city,phone,gbp);
        setResults(data);setView("results");
      }else{
        // Couldn't read the link — send them back to try again / use fallback.
        setFhErr((gbp&&gbp.message)||"We couldn't read that link. Try the full Google listing URL, or use the option below.");
        setView("findhelp");
      }
    }catch(e){
      setFhErr("Something went wrong reading that link. Please try again, or use the option below.");
      setView("findhelp");
    }
  }

  // The user copied their GBP info into the manual form. Use what they
  // provided as the basis for the scan, syncing the name to what they
  // typed so the report consistently describes their business.
  async function findHelpSubmit(){
    if(!fhName.trim())return;
    setView("loading");setStepIdx(0);
    try{
      // Parse the optional numeric fields softly — bad input becomes null
      // rather than crashing the scan.
      const ratingNum=parseFloat(fhRating);
      const reviewNum=parseInt(fhReviewCount,10);
      const realName=fhName.trim();
      const realWebsite=fhWebsite.trim();
      const manualGBP={
        name:realName,
        address:fhAddress.trim()||null,
        phone:fhPhone.trim()||null,
        rating:(!isNaN(ratingNum)&&ratingNum>0)?ratingNum:null,
        reviewCount:(!isNaN(reviewNum)&&reviewNum>=0)?reviewNum:0,
        website:realWebsite||null,
        hasHours:!!fhHasHours,
        isOpen:null,
        photoCount:0,
        businessStatus:null,
        types:fhCategory.trim()?[fhCategory.trim()]:[],
        userProvided:true
      };
      // Sync the displayed business name so the report title, advisor,
      // and findings all describe the SAME business.
      if(realName)setBizName(realName);
      const data=await runScan(realName,realWebsite||website,city,phone,manualGBP);
      setResults(data);setView("results");
    }catch(e){setErrMsg(e.message);setView("error");}
  }

  // The user confirmed they have no Google listing at all.
  // Scan with no GBP — this produces the honest "you're invisible" result.
  async function findHelpNoListing(){
    setView("loading");setStepIdx(0);
    try{
      const data=await runScan(bizName,website,city,phone,null);
      setResults(data);setView("results");
    }catch(e){setErrMsg(e.message);setView("error");}
  }

  function reset(){
    // Clear EVERY piece of state the form holds, so a second scan in the
    // same browser session cannot inherit anything from a previous one.
    // This is the fix for Glitch #6: session contamination across scans.
    setView("form");
    setResults(null);
    setErrMsg("");
    setPendingMatch(null);
    setPhoneMatch(null);
    setFhName("");setFhAddress("");setFhPhone("");setFhMapsUrl("");setFhErr("");
    setFhWebsite("");setFhRating("");setFhReviewCount("");setFhHasHours(false);setFhCategory("");
    // The five user-typed form fields — previously NOT cleared, which is what
    // let an old website value bleed into a later scan and contaminate the AI input.
    setBizName("");
    setWebsite("");
    setCity("");
    setPhone("");
    setEmail("");
    // Sentiment pulse: clear the vote flag so the user can react fresh to
    // each new scan, not just the first one.
    setMoodVoted(false);
  }
  const sc=results?(results.overallScore>=70?"good":results.overallScore>=40?"warn":"bad"):"warn";

  return(
    <div className="wrap">
      <nav className="nav">
        <div className="logo">PresenceScanner</div>
        <span className="badge">Beta</span>
      </nav>

      {view==="form"&&(
        <div className="hero">
          <div className="eyebrow"><span className="dot"/>AI-Powered Presence Scanner</div>
          <h1>Does Your Business<br/><span className="grad">Show Up Online as it Should?</span></h1>
          <p className="sub">Get a free health check on your online footprint — Google, AI search, reviews, and more. Results in plain English, delivered in 30 seconds.</p>
          <div className="card">
            <div className="field"><label>Business Name *</label>
              <input value={bizName} onChange={e=>setBizName(e.target.value)} placeholder="e.g. Joe's Plumbing & Drain"/></div>
            <div className="field"><label>Website URL <span style={{opacity:0.45,fontWeight:400,textTransform:"none",letterSpacing:0}}>(if you have one)</span></label>
              <input value={website} onChange={e=>setWebsite(e.target.value)} placeholder="e.g. https://joesplumbing.com"/></div>
            <div className="field"><label>Business Phone <span style={{opacity:0.45,fontWeight:400,textTransform:"none",letterSpacing:0}}>(helps us find the right listing)</span></label>
              <input value={phone} onChange={e=>setPhone(e.target.value)} placeholder="e.g. (941) 662-9941"/></div>
            <div className="field"><label>City & State *</label>
              <input value={city} onChange={e=>setCity(e.target.value)} placeholder="e.g. Venice, FL"/></div>
            <div className="field"><label>Email Address</label>
              <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="e.g. joe@joesplumbing.com"/>
              <div className="enote">We'll send your full report here. No spam, ever.</div></div>
            <button className="sbtn" onClick={handleScan} disabled={!bizName.trim()||!city.trim()}>
              Run My Free Presence Scan
              <small>Takes about 30 seconds · No credit card needed</small>
            </button>
          </div>
        </div>
      )}

      {view==="loading"&&(
        <div className="loading">
          <div className="spinner"/>
          <h3>Checking {bizName}'s footprint…</h3>
          <p>Looking at Google, AI search, your website, reviews, and more</p>
          <ul className="steps">
            {STEPS.map((s,i)=>(
              <li key={i} className={i<stepIdx?"ok":i===stepIdx?"on":""}>
                <span style={{width:18,textAlign:"center",fontSize:12}}>{i<stepIdx?"✓":i===stepIdx?"◉":"○"}</span>{s}
              </li>
            ))}
          </ul>
        </div>
      )}

      {/* --- Phone-match confirmation (self-contained view) --- */}
      {view==="phoneconfirm"&&phoneMatch&&(
        <div className="pad">
          <div className="card" style={{maxWidth:560,margin:"0 auto"}}>
            <h2 style={{marginTop:0,fontSize:"1.3rem"}}>Is this your business?</h2>
            <p className="sub" style={{marginTop:6}}>We found this Google listing from your phone number. Confirm it's yours so your report is about the right business.</p>
            {namesLookDifferent(bizName,phoneMatch.name)&&(
              <div style={{background:"rgba(176,107,28,0.10)",border:"1px solid rgba(176,107,28,0.45)",borderRadius:10,padding:"12px 14px",margin:"14px 0",color:"#8a5410",fontSize:"0.92rem",lineHeight:1.5}}>
                <div style={{fontWeight:700,marginBottom:4}}>⚠️ Heads up — these don't seem to match</div>
                You typed "<b>{bizName}</b>" but the listing we found from your phone number is "<b>{phoneMatch.name}</b>". Two businesses sometimes share one phone. Check the details below carefully before saying yes.
              </div>
            )}
            <div style={{background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.12)",borderRadius:10,padding:"14px 16px",margin:"14px 0"}}>
              <div style={{fontWeight:700,fontSize:"1.05rem"}}>{phoneMatch.name}</div>
              {phoneMatch.address&&<div style={{opacity:0.7,fontSize:"0.9rem",marginTop:3}}>{phoneMatch.address}</div>}
              {phoneMatch.phone&&<div style={{opacity:0.7,fontSize:"0.9rem",marginTop:1}}>{phoneMatch.phone}</div>}
              {phoneMatch.rating&&<div style={{opacity:0.7,fontSize:"0.9rem",marginTop:1}}>{phoneMatch.rating}★ · {phoneMatch.reviewCount} reviews</div>}
            </div>
            <button className="sbtn" onClick={phoneConfirmYes}>Yes, this is my business</button>
            <button className="rescan" style={{marginTop:10,width:"100%"}} onClick={phoneConfirmNo}>No, that's not my business</button>
          </div>
        </div>
      )}

      {view==="pick"&&pendingMatch&&(
        <div className="pad">
          <div className="card" style={{maxWidth:560,margin:"0 auto"}}>
            <h2 style={{marginTop:0,fontSize:"1.3rem"}}>Which of these is your business?</h2>
            <p className="sub" style={{marginTop:6}}>We found these Google listings. Pick yours so your report is about the right business.</p>
            <div style={{margin:"14px 0"}}>
              {pendingMatch.map((c,i)=>(
                <div key={i} onClick={()=>pickBusiness(c)}
                  style={{background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.12)",borderRadius:10,padding:"13px 15px",marginBottom:10,cursor:"pointer"}}>
                  <div style={{fontWeight:700,fontSize:"1.02rem"}}>{c.name}</div>
                  {c.address&&<div style={{opacity:0.7,fontSize:"0.88rem",marginTop:3}}>{c.address}</div>}
                  {c.phone&&<div style={{opacity:0.7,fontSize:"0.88rem",marginTop:1}}>{c.phone}</div>}
                  {c.rating&&<div style={{opacity:0.7,fontSize:"0.88rem",marginTop:1}}>{c.rating}★ · {c.reviewCount} reviews</div>}
                </div>
              ))}
            </div>
            <button className="rescan" style={{width:"100%"}} onClick={pickNone}>None of these — help me find my business</button>
          </div>
        </div>
      )}

      {/* --- "Help us find your business" step (self-contained view) --- */}
      {view==="findhelp"&&(
        <div className="pad">
          <div className="card" style={{maxWidth:560,margin:"0 auto"}}>
            <h2 style={{marginTop:0,fontSize:"1.3rem"}}>Find your business</h2>
            <p className="sub" style={{marginTop:6}}>Start typing your business name and select it from the list — this is the most accurate way to find your exact Google listing.</p>

            {fhErr&&<div className="err" style={{margin:"10px 0"}}>{fhErr}</div>}

            {/* PRIMARY PATH: the Google autocomplete widget */}
            <div style={{background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.12)",borderRadius:10,padding:"14px 16px",margin:"14px 0"}}>
              <div style={{fontWeight:700,marginBottom:8}}>Search for your business <span style={{opacity:0.55,fontWeight:400}}>(recommended)</span></div>
              <BusinessAutocomplete onPick={findHelpFromWidget} />
              <div style={{fontSize:"0.8rem",opacity:0.6,marginTop:8,lineHeight:1.5}}>
                Tip: if several businesses share a similar name, check the address to pick yours.
              </div>
            </div>

            {/* FALLBACK 1 (primary): Copy from your Google Business Profile.
                This used to be the "enter by hand" path. Renamed and expanded
                to capture real GBP data via copy-paste — sidesteps every
                Google API matching problem while giving the AI accurate
                signal to score against. */}
            <div style={{background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.12)",borderRadius:10,padding:"14px 16px",margin:"14px 0"}}>
              <div style={{fontWeight:700,marginBottom:6}}>Copy from your Google Business Profile</div>
              <div style={{fontSize:"0.88rem",opacity:0.75,marginBottom:14,lineHeight:1.55}}>
                Open your Google Business Profile dashboard in another tab, then copy each piece of info into the boxes below. Only the business name is required — the more you fill in, the more accurate your report.
              </div>
              <div className="field"><label>Business Name *</label>
                <input value={fhName} onChange={e=>setFhName(e.target.value)} placeholder="Exactly as it appears on Google"/></div>
              <div className="field"><label>Business Address</label>
                <input value={fhAddress} onChange={e=>setFhAddress(e.target.value)} placeholder="Street, City, State"/></div>
              <div className="field"><label>Business Phone</label>
                <input value={fhPhone} onChange={e=>setFhPhone(e.target.value)} placeholder="e.g. (941) 662-9941"/></div>
              <div className="field"><label>Website URL on Google</label>
                <input value={fhWebsite} onChange={e=>setFhWebsite(e.target.value)} placeholder="https://yourbusiness.com — leave blank if not set on Google"/></div>
              <div className="field"><label>Star Rating</label>
                <input value={fhRating} onChange={e=>setFhRating(e.target.value)} placeholder="e.g. 4.8"/></div>
              <div className="field"><label>Total Reviews</label>
                <input value={fhReviewCount} onChange={e=>setFhReviewCount(e.target.value)} placeholder="e.g. 47"/></div>
              <div className="field"><label>Business Category on Google</label>
                <input value={fhCategory} onChange={e=>setFhCategory(e.target.value)} placeholder="e.g. Flower Shop, Plumber, Salon"/></div>
              <label style={{display:"flex",alignItems:"center",gap:9,cursor:"pointer",margin:"12px 0",fontSize:"0.92rem"}}>
                <input type="checkbox" checked={fhHasHours} onChange={e=>setFhHasHours(e.target.checked)} style={{width:18,height:18,cursor:"pointer"}}/>
                <span>My Google Business Profile has business hours filled in</span>
              </label>
              <button className="sbtn" onClick={findHelpSubmit} disabled={!fhName.trim()}>Scan with these details</button>
            </div>

            {/* FALLBACK 2 (rare): paste a Google Maps share link. Most Google
                share links don't include a Place ID — this only works when
                yours does. The validator above refuses non-Place-ID URLs
                and routes the user to the "Copy from your GBP" path. */}
            <details style={{margin:"14px 0"}}>
              <summary style={{cursor:"pointer",opacity:0.65,fontSize:"0.88rem"}}>Have a Google listing link with a Place ID? (advanced)</summary>
              <div style={{marginTop:12}}>
                <div style={{fontSize:"0.84rem",opacity:0.65,marginBottom:10,lineHeight:1.5}}>
                  Most Google "Share" links don't include a Place ID. If yours does, paste it here. If not, use the option above.
                </div>
                <div className="field" style={{marginBottom:10}}>
                  <input value={fhMapsUrl} onChange={e=>setFhMapsUrl(e.target.value)} placeholder="Paste a Google link with a Place ID"/></div>
                <button className="sbtn" onClick={findHelpFromLink} disabled={!fhMapsUrl.trim()}>Find my business from this link</button>
              </div>
            </details>

            <button className="rescan" style={{marginTop:6,width:"100%"}} onClick={findHelpNoListing}>I don't have a Google Business Profile yet</button>
          </div>
        </div>
      )}

      {view==="error"&&(
        <div className="pad">
          <div className="err">{errMsg}</div>
          <button className="rescan" onClick={reset}>← Try Again</button>
        </div>
      )}

      {view==="results"&&results&&(
        <div className="results">
          <div className="shero">
            <Ring score={results.overallScore} c={sc}/>
            <div className="sinfo">
              <div className={`gpill ${sc}-g`}>{results.overallGrade}</div>
              <h2>Presence Report: {bizName}</h2>
              {results.gbp ? (
                <div className="sident">
                  <span className="sident-row"><b>Scanned:</b> {results.gbp.name}</span>
                  {results.gbp.address && <span className="sident-row">{results.gbp.address}</span>}
                  {results.gbp.phone && <span className="sident-row">{results.gbp.phone}</span>}
                  {results.gbp.rating && <span className="sident-row"><span className="sident-stars">★★★★★</span> {results.gbp.rating} · {results.gbp.reviewCount || 0} reviews</span>}
                </div>
              ) : (
                <div className="sident">
                  <span className="sident-row"><b>Scanned:</b> {results.scannedInputs?.bizName || bizName}{results.scannedInputs?.city ? ` · ${results.scannedInputs.city}` : ''}</span>
                  <span className="sident-row sident-none">No Google Business Profile was matched for this scan</span>
                </div>
              )}
              <p>{results.summary}</p>
              <div className="priority"><strong>Top Priority</strong>{results.topPriority}</div>
            </div>
          </div>
          {/* Small jump-link teasers so curious users can skip ahead to the
              tools section or the founding-member offer without scrolling
              past the full diagnosis. Visually quiet on purpose so they
              don't compete with the score for attention. */}
          <div className="sjumps">
            <a className="sjump" onClick={()=>document.getElementById('jump-tools')?.scrollIntoView({behavior:'smooth'})}>See recommended tools</a>
            <a className="sjump" onClick={()=>document.getElementById('jump-founding')?.scrollIntoView({behavior:'smooth'})}>Lock in founding pricing</a>
          </div>
          <Chat results={results} bizName={bizName}/>
          {/* AFFILIATE PLACEMENT PRINCIPLE (Decision 4, May 24 2026):
              category findings come FIRST so the user receives the diagnosis
              before any recommendations to spend money. AffCards and the
              founding-member waitlist then sit AFTER the diagnosis, where
              they read as helpful next steps rather than salesy interruptions.
              AlgorithmFeed (generic context) sits below recommendations so
              the user sees their own specific results before any general
              algorithm news (May 25 2026 placement fix). */}
          <div className="cats">{results.categories?.map((cat,i)=><CatCard key={i} cat={cat}/>)}</div>
          <AffCards results={results} bizName={bizName}/>
          <AlgorithmFeed bizType={results.categories?.[0]?.findings?.[0]?.title || bizName} city={city}/>
          <FoundingWaitlist/>
          <SentimentStrip onTextFeedback={requestFeedback} voted={moodVoted} setVoted={setMoodVoted}/>
          <button className="rescan" onClick={reset}>← Scan Another Business</button>
        </div>
      )}
      <BugReport open={bugOpen} setOpen={setBugOpen} mood={bugMood} setMood={setBugMood}
        onSubmitted={(m)=>{if(m==="okay"||m==="frustrating")setMoodVoted(true);}}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
