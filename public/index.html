<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

const HEADERS = {
  "Content-Type": "application/json"
};

const AFF = {
  domain: (n) => `https://www.godaddy.com/domainsearch/find?checkAvail=1&domainToCheck=${encodeURIComponent(n.toLowerCase().replace(/\s+/g,""))}&utm_source=presenceiq&utm_medium=referral`,
  hosting: () => `https://www.godaddy.com/hosting/web-hosting?utm_source=presenceiq&utm_medium=referral`,
  workspace: () => `https://workspace.google.com/?utm_source=presenceiq&utm_medium=referral`,
  gbp: () => `https://business.google.com/create?utm_source=presenceiq`,
};

// ── FOUNDING-MEMBER WAITLIST ──────────────────────────────────────────
// Honest scarcity: this number is the REAL count of claimed founding spots.
// When a real spot is claimed, hand-edit FOUNDING_SPOTS_CLAIMED upward and
// re-commit. Do NOT inflate it — fake urgency was explicitly rejected.
const FOUNDING_SPOTS_CLAIMED = 0;
const FOUNDING_SPOTS_TOTAL = 50;

async function callClaude(messages, maxTokens=3000) {
  const res = await fetch("/api/scan", {
    method:"POST", headers:HEADERS,
    body:JSON.stringify({model:"claude-sonnet-4-20250514", max_tokens:maxTokens, messages})
  });
  if(!res.ok){const t=await res.text();throw new Error("API "+res.status+": "+t.slice(0,200));}
  const d=await res.json();
  return d.content.map(b=>b.text||"").join("");
}

async function getCandidates(bizName, city, phone, website) {
  try {
    const res = await fetch("/api/places", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({bizName, city, phone, website})
    });
    if (!res.ok) return null;
    return await res.json();
  } catch { return null; }
}

async function getSiteData(website) {
  try {
    const res = await fetch("/api/fetchsite", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ website })
    });
    if (!res.ok) return null;
    return await res.json();
  } catch { return null; }
}

async function runScan(bizName, website, city, phone, gbp) {
  // gbp is the business the user picked (an object), or null if they
  // said their business isn't on Google. runScan never fetches it itself.

  // Fix #3 — figure out the website situation deterministically up front,
  // instead of letting the AI guess from incomplete signals. Three real cases:
  //   (A) business has a website AND it's listed on their Google profile
  //   (B) business has a website but Google's profile doesn't show it
  //   (C) we genuinely can't tell — no website anywhere we looked
  const formWebsite = (website||'').trim();
  const realGBP = !!(gbp && !gbp.userProvided);
  const gbpWebsite = realGBP ? ((gbp.website||'').trim()) : '';
  const knownWebsite = gbpWebsite || formWebsite;
  const websiteMissingFromGBP = realGBP && !!formWebsite && !gbpWebsite;
  const noWebsiteAnywhere = !knownWebsite;

  const site = await getSiteData(website);
  
  const gbpContext = gbp ? `
REAL GOOGLE BUSINESS PROFILE DATA (use this for GBP category — do not guess):
- GBP Found: Yes
- Business Name on Google: ${gbp.name}
- Star Rating: ${gbp.rating || 'No rating yet'}
- Total Reviews: ${gbp.reviewCount}
- Address: ${gbp.address || 'Not listed'}
- Phone: ${gbp.phone || 'Not listed'}
- Website on GBP: ${gbp.website || 'NOT SET'}

` : `

`;

  const siteContext = (site && site.fetched) ? `
REAL WEBSITE DATA (use this for Website Health, AI Search Visibility, and GEO Score — do not guess):
- Website reachable: Yes
- Page title: ${site.title || '(none found)'}

- Approx word count on homepage: ${site.wordCount}
- Text sample from homepage: ${site.textSample || '(none)'}
` : (site && site.likelyAccessibleToHumans) ? `
REAL WEBSITE DATA: A website exists, but our automated scanner could not fetch it. ${site.reasonForUser || ''}
IMPORTANT — handle this honestly:
- This is very likely just the website's security/firewall settings blocking our scanner. It does NOT mean the website is broken, and it likely works fine for human visitors and for Google.
- Do NOT claim the website has "technical issues", "server configuration problems", or is "broken" or "inaccessible to customers". You do not know that — it is not true based on this data.
- For Website Health, AI Search Visibility, and GEO Score: do NOT score these low as a penalty. Treat them as NOT MEASURED for this scan. Give each a neutral score of 50 and ONE finding explaining honestly that the website could not be scanned automatically (often due to security settings) so analysis was skipped — status 'warn', a gentle action like 'Website analysis was skipped — this is usually a security setting, not a problem'.
- The overall score must not be dragged down just because our scanner was blocked.
` : noWebsiteAnywhere ? `
REAL WEBSITE DATA: No website was provided by the user and none is listed on the Google Business Profile. Be honest about the ambiguity in your findings: we cannot tell from this data whether (a) the business has no website at all, or (b) the business has one but it isn't on their Google listing and wasn't given to us. Either way, customers searching online can't easily find a website for this business, which genuinely limits visibility. For Website Health, AI Search Visibility, and GEO Score, score honestly low. In the findings say "no website was found anywhere we checked" rather than "this business has no website."
` : `
REAL WEBSITE DATA: A website is known to exist (${knownWebsite}) but our automated scanner could not fetch it. Treat Website Health, AI Search Visibility, and GEO Score as NOT MEASURED — give each a neutral score of 50 with ONE finding explaining honestly that the website could not be scanned automatically (often a security setting), so analysis was skipped. Do NOT claim the website is broken. Do NOT penalize the overall score.
`;

  const prompt = "You are auditing a local business's online presence. Use ONLY the real data provided below. Do NOT invent facts. Return ONLY valid JSON, no other text.\n\nBusiness: "+bizName+"\nWebsite: "+(website||"none")+"\nCity: "+city+"\n\n"+gbpContext+"\n"+siteContext+"\n\nReturn this JSON:\n{\"overallScore\":50,\"overallGrade\":\"Needs Work\",\"summary\":\"2 sentence summary\",\"topPriority\":\"top action\",\"hasWebsite\":false,\"categories\":[{\"name\":\"Website Health\",\"subtitle\":\"SEO and mobile\",\"icon\":\"🌐\",\"score\":50,\"findings\":[{\"title\":\"finding\",\"detail\":\"detail\",\"status\":\"warn\",\"action\":\"action\"}]},{\"name\":\"Google Business Profile\",\"subtitle\":\"Local ranking power\",\"icon\":\"📍\",\"score\":50,\"findings\":[]},{\"name\":\"AI Search Visibility\",\"subtitle\":\"ChatGPT and Google AI\",\"icon\":\"🤖\",\"score\":50,\"findings\":[]},{\"name\":\"Citation Consistency\",\"subtitle\":\"NAP across the web\",\"icon\":\"📋\",\"score\":-1,\"comingSoon\":true,\"findings\":[]},{\"name\":\"Social Presence\",\"subtitle\":\"Facebook and Instagram\",\"icon\":\"📱\",\"score\":-1,\"comingSoon\":true,\"findings\":[]},{\"name\":\"Review Authority\",\"subtitle\":\"Volume and recency\",\"icon\":\"⭐\",\"score\":50,\"findings\":[]},{\"name\":\"GEO Score\",\"subtitle\":\"AI search trust and authority\",\"icon\":\"🧠\",\"score\":50,\"findings\":[]}]}\n\nSCORING RULES:\n- Score these FIVE categories with real numbers 0-100 based strictly on the real data above: Website Health, Google Business Profile, AI Search Visibility, Review Authority, GEO Score. Vary the scores honestly — a business with schema, FAQ, good word count and strong reviews should score well; one missing those should score low. Do NOT give every category a similar number.\n- For Citation Consistency and Social Presence: these are NOT measured yet. Keep score as -1 and comingSoon as true exactly as shown. Give each ONE finding with title 'Coming soon', a short detail explaining full citation/social analysis is being added, status 'warn', and no action. Do not invent a score for these two.\n- overallScore must be the average of ONLY the five real scored categories (ignore the two coming-soon ones).\n- Use the REAL GBP DATA for the Google Business Profile category. Use the REAL WEBSITE DATA for Website Health, AI Search Visibility and GEO Score.\n- Each of the five scored categories needs exactly 3 specific findings based on the real data. Be concrete — reference actual things found or missing.\n- For GEO Score: assess whether ChatGPT or Perplexity would recommend this business, based on whether the real website data shows schema markup and FAQ content AI can cite. Score harshly — most small businesses score under 35 on GEO.\n- If 'IMPORTANT FIX OPPORTUNITY' is mentioned in the GBP data above, you MUST surface it as one of the three findings in the Google Business Profile category. Title it 'Website missing from your Google listing', detail it in one short sentence, status 'bad', action: 'Add your website URL to your Google Business Profile dashboard — a free 2-minute fix.'";
  const raw = await callClaude([{role:"user",content:prompt}], 3000);
  const clean = raw.replace(/```json|```/g,"").trim();
  // Helper: attach the matched-business context to the parsed result so the
  // results page can show the user "here is the business we actually scanned"
  // (Glitch #2). gbp may be null when the user said they have no listing.
  function withIdentity(parsed){
    if(parsed && typeof parsed==='object'){
      parsed.gbp = gbp || null;
      parsed.scannedInputs = { bizName, city };
      // Fix #3 — trust our deterministic state, not the AI's guess.
      parsed.hasWebsite = !noWebsiteAnywhere;
      parsed.websiteMissingFromGBP = websiteMissingFromGBP;
    }
    return parsed;
  }
  try { return withIdentity(JSON.parse(clean)); }
  catch {
    const s=clean.indexOf("{"), e=clean.lastIndexOf("}");
    if(s!==-1&&e!==-1){try{return withIdentity(JSON.parse(clean.slice(s,e+1)));}catch(e2){}}
    throw new Error("Please try again — the scan occasionally needs a second attempt.");
  }
}

// --- Name-mismatch detector (Fix #8) ---
// Returns true when the business name the owner TYPED has no meaningful
// words in common with the name on the Google listing we matched. Used
// to warn the owner before they confirm the wrong listing — common when
// two businesses share a phone number (entity conflation).
function namesLookDifferent(typed, matched){
  if(!typed||!matched)return false;
  const stop=new Set(["the","of","and","for","llc","inc","co","corp","company","ltd","group","services","service","fl","florida","usa","us"]);
  const toks=s=>s.toLowerCase().replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(w=>w.length>=3&&!stop.has(w));
  const t=new Set(toks(typed));
  const m=new Set(toks(matched));
  if(t.size===0||m.size===0)return false;
  for(const w of t){if(m.has(w))return false;}
  return true;
}

// --- Google Place Autocomplete widget, wrapped as a React component ---
// Mounts Google's autocomplete on an input. When the user picks a
// business from the dropdown, calls onPick with {placeId, name, address}.
function BusinessAutocomplete({ onPick }) {
  const inputRef = useRef(null);
  const mountedRef = useRef(false);
  const [status, setStatus] = useState("loading"); // loading | ready | failed

  useEffect(() => {
    // Wait for Google's library to be available, then mount once.
    let tries = 0;
    const tryMount = () => {
      if (mountedRef.current) return;
      if (window.google && window.google.maps && window.google.maps.places && inputRef.current) {
        mountedRef.current = true;
        const ac = new window.google.maps.places.Autocomplete(inputRef.current, {
          types: ["establishment"],
          fields: ["place_id", "name", "formatted_address"],
          // Fix #4 — bias predictions toward Florida so local businesses
          // rank higher and stop dropping off the list as the owner types.
          // Soft bias (strictBounds:false by default) — businesses outside
          // Florida still appear if the owner types them clearly.
          bounds: new window.google.maps.LatLngBounds(
            new window.google.maps.LatLng(24.396308, -87.634938),
            new window.google.maps.LatLng(31.000888, -79.974306)
          ),
        });
        ac.addListener("place_changed", () => {
          const place = ac.getPlace();
          if (place && place.place_id) {
            onPick({
              placeId: place.place_id,
              name: place.name || "",
              address: place.formatted_address || "",
            });
          }
        });
        setStatus("ready");
        return;
      }
      tries++;
      if (tries > 40) { setStatus("failed"); return; } // ~10s of waiting
      setTimeout(tryMount, 250);
    };
    tryMount();
  }, []);

  return (
    <div>
      <input ref={inputRef} type="text"
        placeholder="Start typing your business name..."
        style={{width:"100%",padding:"12px 14px",fontSize:"1rem",
          border:"1px solid rgba(255,255,255,0.2)",borderRadius:8,
          background:"rgba(0,0,0,0.04)",color:"inherit",boxSizing:"border-box"}} />
      {status==="failed" && (
        <div className="err" style={{marginTop:8,fontSize:"0.85rem"}}>
          The business search could not load. Please use one of the options below instead.
        </div>
      )}
    </div>
  );
}

        const pData=await pRes.json();
        if(pData&&pData.found){
          // Found a business by phone. Show it and let the owner confirm.
          setPhoneMatch(pData);
          setView("phoneconfirm");
          return;
        }
      }
      // No phone match (or no phone given) — fall through to the
      // existing name-search flow (pick-a-list / findhelp).
      const result=await getCandidates(bizName,city,phone,website);
      if(result&&result.found&&result.candidates&&result.candidates.length>0){
        setPendingMatch(result.candidates);
        setView("pick");
        return;
      }
      // Google's search found nothing. Don't scan blind — send the user
      // to the "help us find your business" screen.
      pickNone();
      return;
    }catch(e){setErrMsg(e.message);setView("error");}
  }

  // --- Phone-match confirmation handlers (self-contained) ---
  // Owner confirmed the phone-matched business is theirs — scan it.
  async function phoneConfirmYes(){
    setView("loading");setStepIdx(0);
    try{
      // Use the listing's name so the report title, advisor, and findings
      // all describe the SAME business (instead of the typed name on the
      // title and the listing's name in the findings).
      const realName=phoneMatch.name||bizName;
      if(realName)setBizName(realName);
      // Use the website from the phone-matched Google listing. The form
      // field may be blank; the matched listing is the real business.
      const data=await runScan(realName,phoneMatch.website||website,city,phone,phoneMatch);
      setResults(data);setView("results");
    }catch(e){setErrMsg(e.message);setView("error");}
  }

  // Owner said the phone-matched business is NOT theirs — fall through
  // to the existing name-search flow so they can find the right one.
  async function phoneConfirmNo(){
    setView("loading");setStepIdx(0);
    try{
      const result=await getCandidates(bizName,city,phone,website);
      if(result&&result.found&&result.candidates&&result.candidates.length>0){
        setPendingMatch(result.candidates);
        setView("pick");
        return;
      }
      pickNone();
    }catch(e){setErrMsg(e.message);setView("error");}
  }

  // User picked a business from the list — scan that one.
  async function pickBusiness(chosen){
    setView("loading");setStepIdx(0);
    try{
      // Use the chosen listing's name and website (not the typed form
      // values) so the report consistently describes that business.
      const realName=chosen.name||bizName;
      const realWebsite=chosen.website||website;
      if(realName)setBizName(realName);
      const data=await runScan(realName,realWebsite,city,phone,chosen);
      setResults(data);setView("results");
    }catch(e){setErrMsg(e.message);setView("error");}
  }

  // User said none of the listed businesses are theirs.
  // Instead of scanning blind, take them to the "help us find your business" step.
  function pickNone(){
    // Pre-fill the name field with what they already typed, as a convenience.
    setFhName(bizName||"");
    setFhAddress("");
    setFhPhone(phone||"");
    setView("findhelp");
  }

  // --- "Help us find your business" step handlers (self-contained) ---

  // BEST PATH: the user pasted their Google Maps link. We send it to
  // resolveplace.js, which reads the business ID out of the link and
  // fetches the REAL listing — real reviews, photos, hours.
  // BEST PATH: the user picked their business from the autocomplete
  // widget. We have the exact Google place_id — fetch that exact
  // business and scan it. No guessing, no wrong business.
  async function findHelpFromWidget(picked){
    if(!picked||!picked.placeId)return;
    setFhErr("");
    setView("loading");setStepIdx(0);
    try{
      const res=await fetch("/api/resolveplace",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({placeId:picked.placeId})
      });
      const gbp=await res.json();
      if(gbp&&gbp.found){
        // Use the PICKED business's own name and website — not the
        // stale form fields. The form may have a made-up name or a
        // blank website; the picked business is the real one.
        const realName=gbp.name||picked.name||bizName;
        const realWebsite=gbp.website||"";
        // Update the displayed business name so the report title,
        // loading screen, and AI advisor all show the picked business.
        if(realName)setBizName(realName);
        const data=await runScan(realName,realWebsite,city,phone,gbp);
        setResults(data);setView("results");
      }else{
        setFhErr((gbp&&gbp.message)||"We couldn't load that business. Please try again or use another option below.");
        setView("findhelp");
      }
    }catch(e){
      setFhErr("Something went wrong loading that business. Please try again.");
      setView("findhelp");
    }
  }

  async function findHelpFromLink(){
    if(!fhMapsUrl.trim())return;
    setFhErr("");
    setView("loading");setStepIdx(0);
    try{
      const res=await fetch("/api/resolveplace",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({mapsUrl:fhMapsUrl.trim()})
      });
      const gbp=await res.json();
      if(gbp&&gbp.found){
        // Use the resolved listing's name and website, not the typed form
        // values, so the report consistently describes that business.
        const realName=gbp.name||bizName;
        if(realName)setBizName(realName);
        const data=await runScan(realName,gbp.website||website,city,phone,gbp);
        setResults(data);setView("results");
      }else{
        // Couldn't read the link — send them back to try again / use fallback.
        setFhErr((gbp&&gbp.message)||"We couldn't read that link. Try the full Google listing URL, or enter your details below.");
        setView("findhelp");
      }
    }catch(e){
      setFhErr("Something went wrong reading that link. Please try again, or enter your details below.");
      setView("findhelp");
    }
  }

  // FALLBACK: the user typed their details by hand. Honest limitation —
  // this identifies the business but cannot pull real reviews/photos,
  // so the GBP portion of the report is marked as user-provided.
  async function findHelpSubmit(){
    if(!fhName.trim())return;
    setView("loading");setStepIdx(0);
    try{
      const manualGBP={
        name:fhName.trim(),
        address:fhAddress.trim()||null,
        phone:fhPhone.trim()||null,
        rating:null,reviewCount:0,website:null,
        hasHours:false,isOpen:null,photoCount:0,
        businessStatus:null,types:[],
        userProvided:true
      };
      const data=await runScan(bizName,website,city,phone,manualGBP);
      setResults(data);setView("results");
    }catch(e){setErrMsg(e.message);setView("error");}
  }

  // The user confirmed they have no Google listing at all.
  // Scan with no GBP — this produces the honest "you're invisible" result.
  async function findHelpNoListing(){
    setView("loading");setStepIdx(0);
    try{
      const data=await runScan(bizName,website,city,phone,null);
      setResults(data);setView("results");
    }catch(e){setErrMsg(e.message);setView("error");}
  }

  function reset(){
    // Clear EVERY piece of state the form holds, so a second scan in the
    // same browser session cannot inherit anything from a previous one.
    // This is the fix for Glitch #6: session contamination across scans.
    setView("form");
    setResults(null);
    setErrMsg("");
    setPendingMatch(null);
    setPhoneMatch(null);
    setFhName("");setFhAddress("");setFhPhone("");setFhMapsUrl("");setFhErr("");
    // The five user-typed form fields — previously NOT cleared, which is what
    // let an old website value bleed into a later scan and contaminate the AI input.
    setBizName("");
    setWebsite("");
    setCity("");
    setPhone("");
    setEmail("");
  }
  const sc=results?(results.overallScore>=70?"good":results.overallScore>=40?"warn":"bad"):"warn";

  return(
    <div className="wrap">
      <nav className="nav">
        <div className="logo">PresenceScanner</div>
        <span className="badge">Beta</span>
      </nav>

      {view==="form"&&(
        <div className="hero">
          <div className="eyebrow"><span className="dot"/>AI-Powered Presence Scanner</div>
          <h1>Does Your Business<br/><span className="grad">Show Up Online as it Should?</span></h1>
          <p className="sub">Get a free health check on your online footprint — Google, AI search, reviews, and more. Results in plain English, delivered in 30 seconds.</p>
          <div className="card">
            <div className="field"><label>Business Name *</label>
              <input value={bizName} onChange={e=>setBizName(e.target.value)} placeholder="e.g. Joe's Plumbing & Drain"/></div>
            <div className="field"><label>Website URL <span style={{opacity:0.45,fontWeight:400,textTransform:"none",letterSpacing:0}}>(if you have one)</span></label>
              <input value={website} onChange={e=>setWebsite(e.target.value)} placeholder="e.g. https://joesplumbing.com"/></div>
            <div className="field"><label>Business Phone <span style={{opacity:0.45,fontWeight:400,textTransform:"none",letterSpacing:0}}>(helps us find the right listing)</span></label>
              <input value={phone} onChange={e=>setPhone(e.target.value)} placeholder="e.g. (941) 662-9941"/></div>
            <div className="field"><label>City & State *</label>
              <input value={city} onChange={e=>setCity(e.target.value)} placeholder="e.g. Venice, FL"/></div>
            <div className="field"><label>Email Address</label>
              <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="e.g. joe@joesplumbing.com"/>
              <div className="enote">We'll send your full report here. No spam, ever.</div></div>
            <button className="sbtn" onClick={handleScan} disabled={!bizName.trim()||!city.trim()}>
              Run My Free Presence Scan
              <small>Takes about 30 seconds · No credit card needed</small>
            </button>
          </div>
        </div>
      )}

      {view==="loading"&&(
        <div className="loading">
          <div className="spinner"/>
          <h3>Checking {bizName}'s footprint…</h3>
          <p>Looking at Google, AI search, your website, reviews, and more</p>
          <ul className="steps">
            {STEPS.map((s,i)=>(
              <li key={i} className={i<stepIdx?"ok":i===stepIdx?"on":""}>
                <span style={{width:18,textAlign:"center",fontSize:12}}>{i<stepIdx?"✓":i===stepIdx?"◉":"○"}</span>{s}
              </li>
            ))}
          </ul>
        </div>
      )}

      {/* --- Phone-match confirmation (self-contained view) --- */}
      {view==="phoneconfirm"&&phoneMatch&&(
        <div className="pad">
          <div className="card" style={{maxWidth:560,margin:"0 auto"}}>
            <h2 style={{marginTop:0,fontSize:"1.3rem"}}>Is this your business?</h2>
            <p className="sub" style={{marginTop:6}}>We found this Google listing from your phone number. Confirm it's yours so your report is about the right business.</p>
            {namesLookDifferent(bizName,phoneMatch.name)&&(
              <div style={{background:"rgba(176,107,28,0.10)",border:"1px solid rgba(176,107,28,0.45)",borderRadius:10,padding:"12px 14px",margin:"14px 0",color:"#8a5410",fontSize:"0.92rem",lineHeight:1.5}}>
                <div style={{fontWeight:700,marginBottom:4}}>⚠️ Heads up — these don't seem to match</div>
                You typed "<b>{bizName}</b>" but the listing we found from your phone number is "<b>{phoneMatch.name}</b>". Two businesses sometimes share one phone. Check the details below carefully before saying yes.
              </div>
            )}
            <div style={{background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.12)",borderRadius:10,padding:"14px 16px",margin:"14px 0"}}>
              <div style={{fontWeight:700,fontSize:"1.05rem"}}>{phoneMatch.name}</div>
              {phoneMatch.address&&<div style={{opacity:0.7,fontSize:"0.9rem",marginTop:3}}>{phoneMatch.address}</div>}
              {phoneMatch.phone&&<div style={{opacity:0.7,fontSize:"0.9rem",marginTop:1}}>{phoneMatch.phone}</div>}
              {phoneMatch.rating&&<div style={{opacity:0.7,fontSize:"0.9rem",marginTop:1}}>{phoneMatch.rating}★ · {phoneMatch.reviewCount} reviews</div>}
            </div>
            <button className="sbtn" onClick={phoneConfirmYes}>Yes, this is my business</button>
            <button className="rescan" style={{marginTop:10,width:"100%"}} onClick={phoneConfirmNo}>No, that's not my business</button>
          </div>
        </div>
      )}

      {view==="pick"&&pendingMatch&&(
        <div className="pad">
          <div className="card" style={{maxWidth:560,margin:"0 auto"}}>
            <h2 style={{marginTop:0,fontSize:"1.3rem"}}>Which of these is your business?</h2>
            <p className="sub" style={{marginTop:6}}>We found these Google listings. Pick yours so your report is about the right business.</p>
            <div style={{margin:"14px 0"}}>
              {pendingMatch.map((c,i)=>(
                <div key={i} onClick={()=>pickBusiness(c)}
                  style={{background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.12)",borderRadius:10,padding:"13px 15px",marginBottom:10,cursor:"pointer"}}>
                  <div style={{fontWeight:700,fontSize:"1.02rem"}}>{c.name}</div>
                  {c.address&&<div style={{opacity:0.7,fontSize:"0.88rem",marginTop:3}}>{c.address}</div>}
                  {c.phone&&<div style={{opacity:0.7,fontSize:"0.88rem",marginTop:1}}>{c.phone}</div>}
                  {c.rating&&<div style={{opacity:0.7,fontSize:"0.88rem",marginTop:1}}>{c.rating}★ · {c.reviewCount} reviews</div>}
                </div>
              ))}
            </div>
            <button className="rescan" style={{width:"100%"}} onClick={pickNone}>None of these — help me find my business</button>
          </div>
        </div>
      )}

      {/* --- "Help us find your business" step (self-contained view) --- */}
      {view==="findhelp"&&(
        <div className="pad">
          <div className="card" style={{maxWidth:560,margin:"0 auto"}}>
            <h2 style={{marginTop:0,fontSize:"1.3rem"}}>Find your business</h2>
            <p className="sub" style={{marginTop:6}}>Start typing your business name and select it from the list — this is the most accurate way to find your exact Google listing.</p>

            {fhErr&&<div className="err" style={{margin:"10px 0"}}>{fhErr}</div>}

            {/* PRIMARY PATH: the Google autocomplete widget */}
            <div style={{background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.12)",borderRadius:10,padding:"14px 16px",margin:"14px 0"}}>
              <div style={{fontWeight:700,marginBottom:8}}>Search for your business <span style={{opacity:0.55,fontWeight:400}}>(recommended)</span></div>
              <BusinessAutocomplete onPick={findHelpFromWidget} />
              <div style={{fontSize:"0.8rem",opacity:0.6,marginTop:8,lineHeight:1.5}}>
                Tip: if several businesses share a similar name, check the address to pick yours.
              </div>
            </div>

            {/* FALLBACK 1: paste a Google Maps link */}
            <details style={{margin:"14px 0"}}>
              <summary style={{cursor:"pointer",opacity:0.75,fontSize:"0.9rem"}}>Can't find it? Paste your Google listing link instead</summary>
              <div style={{marginTop:12}}>
                <div style={{fontSize:"0.84rem",opacity:0.7,marginBottom:10,lineHeight:1.5}}>
                  On Google, find your business, tap the <strong>three dots ( ⋮ )</strong> menu, choose <strong>Share</strong>, then copy the link and paste it here.
                </div>
                <div className="field" style={{marginBottom:10}}>
                  <input value={fhMapsUrl} onChange={e=>setFhMapsUrl(e.target.value)} placeholder="Paste your Google listing link here"/></div>
                <button className="sbtn" onClick={findHelpFromLink} disabled={!fhMapsUrl.trim()}>Find my business from this link</button>
              </div>
            </details>

            {/* FALLBACK 2: type details by hand */}
            <details style={{margin:"14px 0"}}>
              <summary style={{cursor:"pointer",opacity:0.75,fontSize:"0.9rem"}}>Or enter your details by hand</summary>
              <div style={{marginTop:12}}>
                <p className="sub" style={{fontSize:"0.84rem",marginTop:0}}>Note: entered by hand, we can't verify your Google reviews or photos, so that part of your report will be limited.</p>
                <div className="field"><label>Exact Business Name *</label>
                  <input value={fhName} onChange={e=>setFhName(e.target.value)} placeholder="Exactly as it appears on Google"/></div>
                <div className="field"><label>Business Address</label>
                  <input value={fhAddress} onChange={e=>setFhAddress(e.target.value)} placeholder="Street, City, State"/></div>
                <div className="field"><label>Business Phone</label>
                  <input value={fhPhone} onChange={e=>setFhPhone(e.target.value)} placeholder="e.g. (941) 662-9941"/></div>
                <button className="sbtn" onClick={findHelpSubmit} disabled={!fhName.trim()}>Scan with these details</button>
              </div>
            </details>

            <button className="rescan" style={{marginTop:6,width:"100%"}} onClick={findHelpNoListing}>I don't have a Google Business Profile</button>
          </div>
        </div>
      )}

      {view==="error"&&(
        <div className="pad">
          <div className="err">{errMsg}</div>
          <button className="rescan" onClick={reset}>← Try Again</button>
        </div>
      )}

      {view==="results"&&results&&(
        <div className="results">
          <div className="shero">
            <Ring score={results.overallScore} c={sc}/>
            <div className="sinfo">
              <div className={`gpill ${sc}-g`}>{results.overallGrade}</div>
              <h2>Presence Report: {bizName}</h2>
              {results.gbp ? (
                <div className="sident">
                  <span className="sident-row"><b>Scanned:</b> {results.gbp.name}</span>
                  {results.gbp.address && <span className="sident-row">{results.gbp.address}</span>}
                  {results.gbp.phone && <span className="sident-row">{results.gbp.phone}</span>}
                  {results.gbp.rating && <span className="sident-row"><span className="sident-stars">★★★★★</span> {results.gbp.rating} · {results.gbp.reviewCount || 0} reviews</span>}
                </div>
              ) : (
                <div className="sident">
                  <span className="sident-row"><b>Scanned:</b> {results.scannedInputs?.bizName || bizName}{results.scannedInputs?.city ? ` · ${results.scannedInputs.city}` : ''}</span>
                  <span className="sident-row sident-none">No Google Business Profile was matched for this scan</span>
                </div>
              )}
              <p>{results.summary}</p>
              <div className="priority"><strong>Top Priority</strong>{results.topPriority}</div>
            </div>
          </div>
          {/* Small jump-link teasers so curious users can skip ahead to the
              tools section or the founding-member offer without scrolling
              past the full diagnosis. Visually quiet on purpose so they
              don't compete with the score for attention. */}
          <div className="sjumps">
            <a className="sjump" onClick={()=>document.getElementById('jump-tools')?.scrollIntoView({behavior:'smooth'})}>See recommended tools</a>
            <a className="sjump" onClick={()=>document.getElementById('jump-founding')?.scrollIntoView({behavior:'smooth'})}>Lock in founding pricing</a>
          </div>
          <Chat results={results} bizName={bizName}/>
          <AlgorithmFeed bizType={results.categories?.[0]?.findings?.[0]?.title || bizName} city={city}/>
          {/* AFFILIATE PLACEMENT PRINCIPLE (Decision 4, May 24 2026):
              category findings come FIRST so the user receives the diagnosis
              before any recommendations to spend money. AffCards and the
              founding-member waitlist then sit AFTER the diagnosis, where
              they read as helpful next steps rather than salesy interruptions. */}
          <div className="cats">{results.categories?.map((cat,i)=><CatCard key={i} cat={cat}/>)}</div>
          <AffCards results={results} bizName={bizName}/>
          <FoundingWaitlist/>
          <button className="rescan" onClick={reset}>← Scan Another Business</button>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
