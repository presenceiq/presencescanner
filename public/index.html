  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="PresenceScanner — free online footprint health check for small businesses. See how Google, AI search, and customers find you, with plain-English fixes in 30 seconds." />
  <title>PresenceScanner — Free Online Footprint Health Check</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#f7f8fa;--s1:#ffffff;--s2:#f1f3f6;--b1:#e2e6ec;--b2:#cbd2dc;
      --cyan:#2b8eb0;--purple:#6d28d9;--green:#0a8a5f;--amber:#b06b1c;--red:#b91c1c;
      --t1:#1a202c;--t2:#4a5568;--t3:#718096;
      --fh:'Syne',sans-serif;--fb:'DM Sans',sans-serif;
    }
    body{background:var(--bg);color:var(--t1);font-family:var(--fb);min-height:100vh}
    .wrap{min-height:100vh;display:flex;flex-direction:column}
    .nav{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;border-bottom:1px solid rgba(30,45,69,0.12)}
    .logo{font-family:var(--fh);font-size:1.25rem;font-weight:800;letter-spacing:-0.5px;background:linear-gradient(135deg,var(--cyan),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .badge{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--cyan);background:rgba(43,142,176,0.08);border:1px solid rgba(43,142,176,0.2);border-radius:100px;padding:3px 10px}
    .hero{padding:56px 24px 40px;text-align:center;background:radial-gradient(ellipse 70% 50% at 50% 0%,rgba(43,142,176,0.08) 0%,transparent 65%)}
    .eyebrow{display:inline-flex;align-items:center;gap:7px;margin-bottom:20px;background:rgba(10,138,95,0.08);border:1px solid rgba(10,138,95,0.2);border-radius:100px;padding:5px 14px;font-size:12px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:var(--green)}
    .dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 2s infinite;display:inline-block}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
    h1{font-family:var(--fh);font-size:clamp(1.8rem,3.6vw,2.5rem);font-weight:600;line-height:1.25;letter-spacing:-0.5px;margin-bottom:18px}
    .grad{background:linear-gradient(135deg,var(--cyan) 0%,var(--purple) 55%,var(--green) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .sub{font-size:1.05rem;color:var(--t2);max-width:500px;margin:0 auto 40px;line-height:1.75;font-weight:300}
    .card{background:var(--s1);border:1px solid var(--b1);border-radius:20px;padding:32px;max-width:560px;margin:0 auto;position:relative;overflow:hidden}
    .card::before{content:'';position:absolute;top:-1px;left:20%;right:20%;height:2px;background:linear-gradient(90deg,transparent,rgba(43,142,176,0.5),rgba(109,40,217,0.5),transparent)}
    .field{margin-bottom:14px}
    .field label{display:block;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--t2);margin-bottom:7px}
    .field input{width:100%;background:var(--s2);border:1px solid var(--b1);border-radius:8px;padding:13px 15px;color:var(--t1);font-family:var(--fb);font-size:1rem;outline:none;transition:border-color 0.2s,box-shadow 0.2s}
    .field input:focus{border-color:rgba(43,142,176,0.4);box-shadow:0 0 0 3px rgba(43,142,176,0.07)}
    .field input::placeholder{color:var(--t3)}
    .enote{font-size:0.82rem;color:var(--t3);margin-top:5px}
    .sbtn{width:100%;margin-top:6px;padding:16px;background:linear-gradient(135deg,var(--cyan),#1f6c87);border:none;border-radius:8px;color:#fff;font-family:var(--fh);font-size:1.05rem;font-weight:700;cursor:pointer;transition:transform 0.15s,box-shadow 0.15s,opacity 0.2s}
    .sbtn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 28px rgba(43,142,176,0.22)}
    .sbtn:disabled{opacity:0.45;cursor:not-allowed}
    .sbtn small{display:block;font-size:0.82rem;opacity:0.65;font-weight:400;margin-top:3px}
    .loading{max-width:440px;margin:64px auto;text-align:center;padding:0 24px}
    .spinner{width:56px;height:56px;border:3px solid var(--b2);border-top-color:var(--cyan);border-radius:50%;animation:spin 0.75s linear infinite;margin:0 auto 22px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loading h3{font-family:var(--fh);font-size:1.15rem;font-weight:700;margin-bottom:6px}
    .loading p{color:var(--t2);font-size:0.95rem;margin-bottom:24px}
    .steps{list-style:none;text-align:left;display:inline-block}
    .steps li{padding:7px 0;font-size:0.95rem;color:var(--t3);display:flex;align-items:center;gap:9px;transition:color 0.3s}
    .steps li.on{color:var(--cyan)}.steps li.ok{color:var(--green)}
    .results{max-width:820px;margin:0 auto;padding:28px 20px 80px}
    .shero{background:var(--s1);border:1px solid var(--b1);border-radius:20px;padding:32px;margin-bottom:16px;display:flex;align-items:center;gap:24px;flex-wrap:wrap;position:relative;overflow:hidden}
    .ring{width:120px;height:120px;position:relative;flex-shrink:0}
    .ring svg{transform:rotate(-90deg)}
    .rnum{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--fh);font-size:2.2rem;font-weight:800;line-height:1}
    .rlbl{font-size:0.72rem;color:var(--t2);letter-spacing:1.5px;text-transform:uppercase;margin-top:3px}
    .sinfo{flex:1;min-width:180px}
    .gpill{display:inline-block;padding:5px 14px;border-radius:100px;font-family:var(--fh);font-size:0.78rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:9px}
    .sinfo h2{font-family:var(--fh);font-size:1.45rem;font-weight:700;margin-bottom:7px;line-height:1.25}
    .sident{margin:6px 0 12px;padding:11px 13px;background:var(--s2);border:1px solid var(--b1);border-radius:8px;font-size:0.95rem;color:var(--t2);line-height:1.55}
    .sident b{color:var(--t1);font-weight:600}
    .sident .sident-row{display:block;margin-top:3px}
    .sident .sident-row:first-child{margin-top:0}
    .sident .sident-none{color:var(--amber);font-weight:500}
    .sident .sident-stars{color:#b08020;letter-spacing:1px;margin-right:3px}
    .sident .sident-link{color:var(--cyan);font-weight:600;text-decoration:none}
    .sident .sident-link:hover{text-decoration:underline}
    .sident .sident-verify{color:var(--t2);font-size:0.82rem}
    .sjumps{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
    .sjump{font-size:0.92rem;color:var(--t2);background:var(--s1);border:1px solid var(--b1);border-radius:100px;padding:6px 13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:5px;transition:border-color 0.2s,color 0.2s}
    .sjump:hover{border-color:rgba(43,142,176,0.35);color:var(--cyan)}
    .sjump::after{content:'↓';font-size:0.7rem;opacity:0.5}
    .sinfo p{color:var(--t2);font-size:1rem;line-height:1.7}
    .priority{margin-top:14px;padding:12px 15px;background:rgba(43,142,176,0.05);border:1px solid rgba(43,142,176,0.15);border-radius:8px;font-size:0.95rem;color:var(--cyan);line-height:1.6}
    .priority strong{display:block;font-size:0.78rem;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:4px;opacity:0.7}
    .cats{display:grid;gap:12px;margin-bottom:16px}
    .cat{background:var(--s1);border:1px solid var(--b1);border-radius:16px;overflow:hidden}
    .chead{padding:16px 20px;display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none}
    .cico{width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
    .cmeta{flex:1}
    .cmeta h3{font-family:var(--fh);font-size:1.05rem;font-weight:700;margin-bottom:2px}
    .cmeta span{font-size:0.88rem;color:var(--t2)}
    .cright{display:flex;align-items:center;gap:9px;flex-shrink:0}
    .bw{width:68px;height:5px;background:var(--b1);border-radius:3px;overflow:hidden}
    .bf{height:100%;border-radius:3px}
    .cpct{font-family:var(--fh);font-size:0.95rem;font-weight:700;min-width:30px;text-align:right}
    .chev{color:var(--t3);font-size:10px;transition:transform 0.2s}
    .chev.open{transform:rotate(180deg)}
    .cbody{border-top:1px solid var(--b1);padding:2px 20px 16px}
    .cbody.shut{display:none}
    .finding{padding:12px 0;border-bottom:1px solid rgba(30,45,69,0.35);display:grid;grid-template-columns:10px 1fr;gap:13px;align-items:start}
    .finding:last-child{border-bottom:none}
    .fd{width:7px;height:7px;border-radius:50%;margin-top:5px}
    .ft h4{font-size:1rem;font-weight:500;margin-bottom:3px}
    .ft p{font-size:0.95rem;color:var(--t2);line-height:1.65}
    .faction{margin-top:8px;padding:9px 12px;background:rgba(43,142,176,0.05);border:1px solid rgba(43,142,176,0.12);border-radius:7px;font-size:0.92rem;color:var(--cyan);line-height:1.55}
    .faction::before{content:'→ ';font-weight:700}
    .aff-wrap{margin-bottom:16px}
    .section-label{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--t2);margin-bottom:11px;padding-left:2px}
    .aff-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:11px}
    .aff{background:var(--s1);border:1px solid var(--b1);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:9px;transition:border-color 0.2s,transform 0.15s}
    .aff:hover{border-color:rgba(43,142,176,0.2);transform:translateY(-2px)}
    .aff-ico{font-size:20px}
    .aff h4{font-family:var(--fh);font-size:1rem;font-weight:700}
    .aff p{font-size:0.92rem;color:var(--t2);line-height:1.6;flex:1}
    .aff a{display:block;padding:10px 13px;background:rgba(43,142,176,0.07);border:1px solid rgba(43,142,176,0.18);border-radius:7px;color:var(--cyan);font-size:0.9rem;font-weight:600;text-decoration:none;text-align:center}
    .aff-note{font-size:0.8rem;color:var(--t3)}
    .fw{background:var(--s1);border:1px solid var(--b1);border-radius:16px;padding:22px;margin-bottom:16px;position:relative;overflow:hidden}
    .fw::before{content:'';position:absolute;top:-1px;left:25%;right:25%;height:2px;background:linear-gradient(90deg,transparent,rgba(109,40,217,0.5),rgba(43,142,176,0.5),transparent)}
    .fw-beta{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--amber);background:rgba(176,107,28,0.08);border:1px solid rgba(176,107,28,0.2);border-radius:100px;padding:4px 11px;margin-bottom:13px}
    .fw h3{font-family:var(--fb);font-size:1.45rem;font-weight:700;margin-bottom:9px;line-height:1.35}
    .fw .fw-lead{font-size:1.05rem;color:var(--t1);line-height:1.7;margin-bottom:14px}
    .fw-offer{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
    .fw-tag{font-size:0.92rem;font-weight:600;color:var(--t1);background:var(--s2);border:1px solid var(--b2);border-radius:7px;padding:7px 12px}
    .fw-tag b{color:var(--cyan);font-family:var(--fb);font-weight:700}
    .fw-count{font-size:1rem;color:var(--t2);margin-bottom:14px}
    .fw-count b{color:var(--green);font-family:var(--fb);font-weight:700}
    .fw-row{display:flex;gap:8px;flex-wrap:wrap}
    .fw-row input{flex:1;min-width:180px;background:var(--s2);border:1px solid var(--b1);border-radius:8px;padding:13px 15px;color:var(--t1);font-family:var(--fb);font-size:1rem;outline:none;transition:border-color 0.2s,box-shadow 0.2s}
    .fw-row input:focus{border-color:rgba(43,142,176,0.4);box-shadow:0 0 0 3px rgba(43,142,176,0.07)}
    .fw-row input::placeholder{color:var(--t3)}
    .fw-row button{padding:13px 22px;background:linear-gradient(135deg,var(--cyan),#1f6c87);border:none;border-radius:8px;color:#fff;font-family:var(--fh);font-size:0.98rem;font-weight:700;cursor:pointer;white-space:nowrap;transition:transform 0.15s,box-shadow 0.15s,opacity 0.2s}
    .fw-row button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 22px rgba(43,142,176,0.2)}
    .fw-row button:disabled{opacity:0.45;cursor:not-allowed}
    .fw-fine{font-size:0.92rem;color:var(--t2);margin-top:9px;line-height:1.6}
    .fw-msg{font-size:1.05rem;font-weight:500;line-height:1.65;padding:15px 17px;border-radius:9px}
    .fw-msg.ok{color:#0a6b48;background:rgba(10,138,95,0.1);border:1px solid rgba(10,138,95,0.35)}
    .fw-msg.bad{color:#b91c1c;background:rgba(185,28,28,0.1);border:1px solid rgba(185,28,28,0.35)}
    .chat{background:var(--s1);border:1px solid var(--b1);border-radius:16px;overflow:hidden;margin-bottom:16px}
    .chat-top{padding:16px 20px;border-bottom:1px solid var(--b1);display:flex;align-items:center;gap:11px}
    .chat-ico{width:34px;height:34px;border-radius:8px;background:rgba(43,142,176,0.1);display:flex;align-items:center;justify-content:center;font-size:15px}
    .chat-top h3{font-family:var(--fh);font-size:1.05rem;font-weight:700}
    .live{font-size:0.85rem;color:var(--green);display:flex;align-items:center;gap:5px;margin-left:auto}
    .msgs{height:260px;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:11px}
    .msg{max-width:86%;font-size:0.97rem;line-height:1.65;padding:9px 13px;border-radius:11px}
    .msg.ai{background:var(--s2);align-self:flex-start;border-bottom-left-radius:3px}
    .msg.user{background:rgba(43,142,176,0.09);border:1px solid rgba(43,142,176,0.15);align-self:flex-end;border-bottom-right-radius:3px}
    .msg.thinking{color:var(--t2);font-style:italic}
    .chat-bottom{padding:12px 20px;border-top:1px solid var(--b1);display:flex;gap:9px}
    .cinput{flex:1;background:var(--s2);border:1px solid var(--b1);border-radius:7px;padding:11px 14px;color:var(--t1);font-family:var(--fb);font-size:0.97rem;outline:none}
    .cinput:focus{border-color:rgba(43,142,176,0.3)}
    .cinput::placeholder{color:var(--t3)}
    .csend{padding:11px 18px;background:var(--cyan);border:none;border-radius:7px;color:#fff;font-weight:700;font-size:0.95rem;cursor:pointer}
    .csend:disabled{opacity:0.35;cursor:not-allowed}
    .gate{background:var(--s1);border:1px solid var(--b1);border-radius:16px;padding:28px;text-align:center;margin-bottom:16px}
    .gate h3{font-family:var(--fh);font-size:1.25rem;font-weight:700;margin-bottom:7px}
    .gate p{color:var(--t2);font-size:1rem;line-height:1.7;margin-bottom:18px;max-width:380px;margin-left:auto;margin-right:auto}
    .gbtn{padding:14px 28px;background:linear-gradient(135deg,var(--cyan),#1f6c87);border:none;border-radius:8px;color:#fff;font-family:var(--fh);font-size:1.02rem;font-weight:700;cursor:pointer}
    .gprice{font-size:0.88rem;color:var(--t3);margin-top:9px}
    .good{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}
    .good-bg{background:rgba(10,138,95,0.1)}.warn-bg{background:rgba(176,107,28,0.1)}.bad-bg{background:rgba(185,28,28,0.1)}
    .good-d{background:var(--green)}.warn-d{background:var(--amber)}.bad-d{background:var(--red)}
    .good-b{background:var(--green)}.warn-b{background:var(--amber)}.bad-b{background:var(--red)}
    .good-g{background:rgba(10,138,95,0.1);color:var(--green);border:1px solid rgba(10,138,95,0.25)}
    .warn-g{background:rgba(176,107,28,0.1);color:var(--amber);border:1px solid rgba(176,107,28,0.25)}
    .bad-g{background:rgba(185,28,28,0.1);color:var(--red);border:1px solid rgba(185,28,28,0.25)}
    .rescan{display:block;margin:24px auto 0;padding:12px 28px;background:transparent;border:1px solid var(--b1);border-radius:8px;color:var(--t2);font-family:var(--fb);font-size:1rem;cursor:pointer}
    .rescan:hover{border-color:var(--cyan);color:var(--cyan)}
    .err{max-width:520px;margin:40px auto;padding:20px 24px;background:rgba(185,28,28,0.07);border:1px solid rgba(185,28,28,0.2);border-radius:12px;color:#b91c1c;font-size:1rem;line-height:1.65;text-align:center}
    .pad{padding:0 20px}
    @media(max-width:500px){.nav{padding:14px 18px}.hero{padding:36px 18px 28px}.card,.shero{padding:22px 18px}.results{padding:20px 14px 60px}}
    /* Bug report widget (Fix #5) — persistent "Something off?" link + modal */
    .bug-link{position:fixed;top:50%;left:calc(75% + 140px);transform:translate(-50%,-50%);z-index:100;background:var(--s1);color:var(--cyan);border:1.5px solid var(--cyan);border-radius:100px;padding:10px 16px;font-family:var(--fb);font-size:0.88rem;font-weight:600;cursor:pointer;box-shadow:0 4px 14px rgba(43,142,176,0.18);transition:all 0.2s;display:inline-flex;align-items:center;gap:9px}
    .bug-link:hover{background:var(--cyan);color:#fff;transform:translate(-50%,-50%) translateX(3px);box-shadow:0 6px 18px rgba(43,142,176,0.28)}
    .bug-link-beta{font-size:0.62rem;font-weight:700;letter-spacing:1.5px;background:var(--cyan);color:#fff;padding:2px 7px;border-radius:100px;line-height:1.3}
    .bug-link:hover .bug-link-beta{background:rgba(255,255,255,0.25)}
    @media(max-width:768px){.bug-link{top:auto;left:auto;bottom:14px;right:14px;transform:none;padding:8px 13px;font-size:0.8rem;gap:7px}.bug-link:hover{transform:translateY(-1px)}.bug-link-beta{font-size:0.58rem;padding:1px 6px}}
    .bug-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;animation:bug-fade 0.2s ease}
    @keyframes bug-fade{from{opacity:0}to{opacity:1}}
    .bug-modal{background:var(--s1);border:1px solid var(--b1);border-radius:16px;padding:28px 26px;max-width:500px;width:100%;position:relative;max-height:90vh;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,0.15)}
    .bug-modal h3{font-family:var(--fh);font-size:1.3rem;font-weight:700;margin-bottom:10px;color:var(--t1)}
    .bug-modal p{font-size:0.98rem;color:var(--t2);line-height:1.6;margin-bottom:16px}
    .bug-modal label{display:block;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--t2);margin-bottom:6px;margin-top:14px}
    .bug-modal textarea,.bug-modal input[type="email"]{width:100%;background:var(--s2);border:1px solid var(--b1);border-radius:8px;padding:12px 14px;color:var(--t1);font-family:var(--fb);font-size:1rem;outline:none;box-sizing:border-box}
    .bug-modal textarea{min-height:100px;resize:vertical}
    .bug-modal textarea:focus,.bug-modal input[type="email"]:focus{border-color:var(--cyan)}
    .bug-modal input[type="file"]{width:100%;padding:8px 0;color:var(--t2);font-size:0.9rem;font-family:var(--fb)}
    .bug-help{font-size:0.92rem;color:var(--t2);margin:-4px 0 10px;line-height:1.55}
    .bug-file-wrap{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:2px}
    .bug-file-wrap input[type="file"]{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

const HEADERS = {
  "Content-Type": "application/json"
};

const AFF = {
  domain: (n) => `https://www.godaddy.com/domainsearch/find?checkAvail=1&domainToCheck=${encodeURIComponent(n.toLowerCase().replace(/\s+/g,""))}&utm_source=presenceiq&utm_medium=referral`,
  hosting: () => `https://www.godaddy.com/hosting/web-hosting?utm_source=presenceiq&utm_medium=referral`,
  workspace: () => `https://workspace.google.com/?utm_source=presenceiq&utm_medium=referral`,
  gbp: () => `https://business.google.com/create?utm_source=presenceiq`,
};

// ── FOUNDING-MEMBER WAITLIST ──────────────────────────────────────────
// Honest scarcity: this number is the REAL count of claimed founding spots.
// When a real spot is claimed, hand-edit FOUNDING_SPOTS_CLAIMED upward and
// re-commit. Do NOT inflate it — fake urgency was explicitly rejected.
const FOUNDING_SPOTS_CLAIMED = 0;
const FOUNDING_SPOTS_TOTAL = 50;

// ── BUG REPORT FORMSPREE FORM ID ──────────────────────────────────────
// Where "Something off?" submissions go. To set up: log into Formspree,
// create a new form named "PresenceScanner Bug Reports", copy its form
// ID (the random characters at the end of the form URL), and paste it
// below. Until this is set, the modal will still open but submissions
// will fail with an error message.
const BUG_REPORT_FORMSPREE_ID = "xpqnyrdq";

async function callClaude(messages, maxTokens=3000) {
  const res = await fetch("/api/scan", {
    method:"POST", headers:HEADERS,
    body:JSON.stringify({model:"claude-sonnet-4-6", max_tokens:maxTokens, messages})
  });
  if(!res.ok){const t=await res.text();throw new Error("API "+res.status+": "+t.slice(0,200));}
  const d=await res.json();
  // Safety guard: if the response doesn't have a content array (e.g. the
  // API returned an error object instead of a normal message), fail with a
  // clear message instead of crashing on undefined.map.
  if(!d || !Array.isArray(d.content)){
    throw new Error("The scan service returned an unexpected response. Please try again in a moment.");
  }
  return d.content.map(b=>b.text||"").join("");
}

async function getCandidates(bizName, city, phone, website) {
  try {
    const res = await fetch("/api/places", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({bizName, city, phone, website})
    });
    if (!res.ok) return null;
    return await res.json();
  } catch { return null; }
}

async function getSiteData(website) {
  try {
    const res = await fetch("/api/fetchsite", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ website })
    });
    if (!res.ok) return null;
    return await res.json();
  } catch { return null; }
}

async function runScan(bizName, website, city, phone, gbp) {
  // gbp is the business the user picked (an object), or null if they
  // said their business isn't on Google. runScan never fetches it itself.

  // Fix #3 — figure out the website situation deterministically up front,
  // instead of letting the AI guess from incomplete signals. Three real cases:
  //   (A) business has a website AND it's listed on their Google profile
  //   (B) business has a website but Google's profile doesn't show it
  //   (C) we genuinely can't tell — no website anywhere we looked
  const formWebsite = (website||'').trim();
  const realGBP = !!(gbp && !gbp.userProvided);
  const gbpWebsite = realGBP ? ((gbp.website||'').trim()) : '';
  const knownWebsite = gbpWebsite || formWebsite;
  const websiteMissingFromGBP = realGBP && !!formWebsite && !gbpWebsite;
  const noWebsiteAnywhere = !knownWebsite;

  const site = await getSiteData(website);
  
  const userProvided = !!(gbp && gbp.userProvided);
  // Helper: render a GBP attribute honestly. On the manual path a blank/null
  // means "the user didn't provide it" = could not verify, NOT "missing."
  // On the API paths (autocomplete/phone) a real empty value genuinely means
  // the field is empty on Google, so there we still say No/0.
  const hoursLine = (gbp && gbp.hasHours===null)
    ? (userProvided ? 'Not provided — could not verify' : 'No')
    : (gbp && gbp.hasHours ? 'Yes' : 'No');
  const photoLine = (gbp && (gbp.photoCount===null||gbp.photoCount===undefined))
    ? (userProvided ? 'Not provided — could not verify' : '0')
    : (gbp ? gbp.photoCount : '0');
  // On the manual path, any rating/review the user DID enter is SELF-REPORTED,
  // not verified by us. Tag it so the prompt never presents it as a confirmed
  // finding — the user could be guessing, rounding up, or mistaken, and proud
  // owners self-select into entering good numbers. Honesty protects credibility.
  const reviewLine = (gbp && (gbp.reviewCount===null||gbp.reviewCount===undefined))
    ? (userProvided ? 'Not provided — could not verify' : '0')
    : (gbp ? (userProvided ? gbp.reviewCount + ' (as reported by the user — NOT verified by us)' : gbp.reviewCount) : '0');
  const ratingLine = (gbp && (gbp.rating===null||gbp.rating===undefined))
    ? (userProvided ? 'Not provided — could not verify' : 'No rating yet')
    : (gbp ? (userProvided ? gbp.rating + ' (as reported by the user — NOT verified by us)' : gbp.rating) : 'No rating yet');

  const gbpContext = gbp ? `
${userProvided ? `UNCONFIRMED BUSINESS DETAILS — TYPED IN BY THE USER. NO GOOGLE LISTING WAS VERIFIED:
- GBP Found: NOT CONFIRMED. Our automated lookup did not find or verify a Google Business Profile for this business.
- Business Name (typed by the user, NOT read from Google): ${gbp.name}` : `REAL GOOGLE BUSINESS PROFILE DATA (use this for GBP category — do not guess):
- GBP Found: Yes
- Business Name on Google: ${gbp.name}`}
- Star Rating: ${ratingLine}
- Total Reviews: ${reviewLine}
- Address: ${gbp.address || 'Not listed'}
- Phone: ${gbp.phone || 'Not listed'}
- Website on GBP: ${gbp.website || (userProvided ? 'Not provided — could not verify' : 'NOT SET')}
- Has Business Hours Set: ${hoursLine}
- Photo Count: ${photoLine}
- Business Status: ${gbp.businessStatus || 'Unknown'}${userProvided ? `

IMPORTANT — THIS PROFILE DATA WAS ENTERED BY HAND BY THE USER, NOT READ FROM GOOGLE:
We could NOT confirm that a Google Business Profile exists for this business. There are two honest possibilities and you must NOT pick one: (a) our automated lookup failed to find a listing that really does exist — this genuinely happens, even to businesses that rank at the top of Google — or (b) this business does not have a Google listing. You have no way to tell which, and neither does the user typing a name into a box.
ABSOLUTE RULES — breaking any of these produces a false report:
- NEVER state or imply the listing was confirmed. Do not write \"verified Google Business Profile\", \"confirmed GBP listing\", \"has a verified listing\", \"Google listing confirmed\", or anything equivalent.
- NEVER present having a listing as a POSITIVE finding, and never award score for it. You did not confirm one exists.
- NEVER claim the business has NO listing either. You did not confirm that.
- Score the Google Business Profile category NEUTRALLY (around 50): no credit for a listing you did not confirm, no penalty for one you did not confirm is missing. Say plainly in scoreReason that the listing could not be confirmed either way.
- Correct phrasing to use: \"We couldn't confirm a Google Business Profile for this business in our automated scan \u2014 that may mean the listing exists but our lookup missed it, or that there isn't one yet. Checking your Google Business Profile dashboard is the fastest way to know.\"
- The name, address, phone and other details below are simply WHAT THE USER TYPED. Refer to them as \"the details you provided\", never as something we found on Google.
The rest of this data was also typed by hand, so the same care applies:
Any field marked "Not provided — could not verify" means we could not read it — NOT that the business lacks it. For any such field:
- Do NOT write a negative finding (never say "no hours", "zero photos", "no reviews", etc.).
- Frame it warmly and honestly: explain that we could not automatically pull their full Google listing data (a common Google limitation), so those specific details could not be confirmed in this scan — and reassure them this does not reflect badly on their business.
- Gently suggest they can confirm those details look good on their own Google Business Profile dashboard.
- Do NOT lower the score as a penalty for an unverified field. Only score down for things the data explicitly confirms are deficient.
- LEAD WITH STRENGTHS: if the website scan or any entered field shows real positives (good website, schema, reviews they told us about, etc.), make those the focus of the report so the owner sees genuine value, not a list of things you couldn't check.
- SELF-REPORTED RATINGS/REVIEWS: any rating or review count marked "(as reported by the user — NOT verified by us)" was TYPED IN BY THE USER, not pulled from Google. You MUST attribute it to them and never present it as something the tool independently confirmed. Phrase it like "Based on the rating you entered (5.0, 21 reviews)..." or "the 5.0 rating you reported." Do NOT write "we found" or "your profile shows" for these numbers. You may still note that a strong self-reported rating is a good sign, but make crystal clear the number came from the user, not from our scan — so no one mistakes self-entered numbers for verified analysis.` : ''}${websiteMissingFromGBP ? `
- IMPORTANT FIX OPPORTUNITY: The GBP website field is EMPTY but the business has a website (${formWebsite}). Customers searching Google cannot click through. This is a high-priority, free, 2-minute fix.` : ''}
` : `
REAL GOOGLE BUSINESS PROFILE DATA: No GBP listing found for this business. Score GBP category very low.
`;

  // Helper: turn a three-state website signal into honest prompt language.
  // 'found' = confirmed on the page. 'not_found_on_scanned_page' = we read the
  // homepage and it wasn't there (NOT proof the business lacks it). 'unknown'
  // = we couldn't read the page at all.
  const sig = (status) => {
    if (status === 'found') return 'Found on the scanned homepage';
    if (status === 'not_found_on_scanned_page') return 'Not found on the scanned homepage (may exist elsewhere on the site or on another platform — not confirmed absent)';
    return 'Unknown — could not verify';
  };
  const siteContext = (site && site.fetched) ? `
REAL WEBSITE DATA (use this for Website Health, AI Search Visibility, and GEO Score — do not guess):
- Website reachable: Yes
- Page title: ${site.title || '(none found)'}
- Meta description: ${site.metaDescription || '(none found)'}
- Structured data / schema markup: ${sig(site.schemaStatus)}
- Mobile viewport tag: ${sig(site.viewportStatus)}
- H1 headings: ${site.h1Count}, H2 headings: ${site.h2Count}
- FAQ content: ${sig(site.faqStatus)}
- Facebook link: ${sig(site.facebookStatus)}
- Instagram link: ${sig(site.instagramStatus)}
- Approx word count on homepage: ${site.wordCount}
- Text sample from homepage: ${site.textSample || '(none)'}

WEBSITE SIGNAL RULE: For the website signals above, do NOT describe a feature as missing unless it is explicitly marked "Not found on the scanned homepage." Even then, phrase it as "not found on the scanned page," NOT "the business does not have it" — it may exist on another page or platform we did not check. If a signal is "Unknown — could not verify," treat it as unverified: do not write a negative finding about it and do not lower the score for it.
` : (site && site.likelyAccessibleToHumans) ? `
REAL WEBSITE DATA: A website exists, but our automated scanner could not fetch it. ${site.reasonForUser || ''}
IMPORTANT — handle this honestly:
- This is very likely just the website's security/firewall settings blocking our scanner. It does NOT mean the website is broken, and it likely works fine for human visitors and for Google.
- Do NOT claim the website has "technical issues", "server configuration problems", or is "broken" or "inaccessible to customers". You do not know that — it is not true based on this data.
- For Website Health, AI Search Visibility, and GEO Score: do NOT score these low as a penalty. Treat them as NOT MEASURED for this scan. Give each a neutral score of 50 and ONE finding explaining honestly that the website could not be scanned automatically (often due to security settings) so analysis was skipped — status 'warn', a gentle action like 'Website analysis was skipped — this is usually a security setting, not a problem'.
- The overall score must not be dragged down just because our scanner was blocked.
` : noWebsiteAnywhere ? `
REAL WEBSITE DATA: No website was provided by the user and none is listed on the Google Business Profile. Be honest about the ambiguity in your findings: we cannot tell from this data whether (a) the business has no website at all, or (b) the business has one but it isn't on their Google listing and wasn't given to us. Either way, customers searching online can't easily find a website for this business, which genuinely limits visibility. For Website Health, AI Search Visibility, and GEO Score, score honestly low. In the findings say "no website was found anywhere we checked" rather than "this business has no website."
` : `
REAL WEBSITE DATA: A website is known to exist (${knownWebsite}) but our automated scanner could not fetch it. Treat Website Health, AI Search Visibility, and GEO Score as NOT MEASURED — give each a neutral score of 50 with ONE finding explaining honestly that the website could not be scanned automatically (often a security setting), so analysis was skipped. Do NOT claim the website is broken. Do NOT penalize the overall score.
`;

  const prompt = "You are auditing a local business's online presence. Use ONLY the real data provided below. Do NOT invent facts. Return ONLY valid JSON, no other text.\n\nBusiness: "+bizName+"\nWebsite: "+(website||"none")+"\nCity: "+city+"\n\n"+gbpContext+"\n"+siteContext+"\n\nReturn this JSON:\n{\"overallScore\":50,\"overallGrade\":\"Needs Work\",\"summary\":\"2 sentence summary\",\"topPriority\":\"top action\",\"hasWebsite\":false,\"categories\":[{\"name\":\"Website Health\",\"subtitle\":\"SEO and mobile\",\"icon\":\"🌐\",\"score\":50,\"findings\":[{\"title\":\"finding\",\"detail\":\"detail\",\"status\":\"warn\",\"action\":\"action\"}]},{\"name\":\"Google Business Profile\",\"subtitle\":\"Local ranking power\",\"icon\":\"📍\",\"score\":50,\"findings\":[]},{\"name\":\"AI Search Visibility\",\"subtitle\":\"ChatGPT and Google AI\",\"icon\":\"🤖\",\"score\":50,\"findings\":[]},{\"name\":\"Citation Consistency\",\"subtitle\":\"NAP across the web\",\"icon\":\"📋\",\"score\":-1,\"comingSoon\":true,\"findings\":[]},{\"name\":\"Social Presence\",\"subtitle\":\"Facebook and Instagram\",\"icon\":\"📱\",\"score\":-1,\"comingSoon\":true,\"findings\":[]},{\"name\":\"Review Authority\",\"subtitle\":\"Volume and recency\",\"icon\":\"⭐\",\"score\":50,\"findings\":[]},{\"name\":\"GEO Score\",\"subtitle\":\"AI search trust and authority\",\"icon\":\"🧠\",\"score\":50,\"findings\":[]}]}\n\nSCORING RULES:\n- CONFIDENCE CALIBRATION (most important rule): State verified facts confidently. State recommendations cautiously, as suggestions. State AI-visibility and search-ranking claims conservatively. No one — not Google, OpenAI, Perplexity, or Anthropic — publishes a proven formula for what makes AI or search recommend a business, so never claim certainty about it.\\n- SCORE REASON: For each of the FIVE scored categories, add a field \\\"scoreReason\\\" — ONE short plain-English sentence explaining what helped the score and what held it back, so the number is not a mystery. Name the actual things observed. Example: 'Scored well for the 5-star rating and 58 reviews, held back by the low photo count.' Do NOT invent sub-point breakdowns or exact point values (no '27 out of 30') — describe the reasoning in words only, since precise sub-scores would be made up. For the two coming-soon categories, omit scoreReason.\n- The scanner only knows what was on the SCANNED PAGE. NEVER claim 'AI tools cannot cite this business', 'Google has no understanding of this business', 'AI models can't find you', or that something does not exist anywhere — you only checked one page. NEVER call any change 'the highest-impact' or 'the most important' change; you cannot prove ranking of impact. NEVER cite a statistic you cannot source (e.g. 'businesses with 100+ photos get more engagement', 'pages need 500+ words to rank') — no invented numbers or thresholds presented as fact.\n- FACT to INTERPRETATION to RECOMMENDATION: every finding's detail should connect an observed fact to its reasoning to the suggestion, not jump from fact straight to a command. Example of the right shape: 'No FAQ content was detected on the scanned homepage. FAQ sections can help answer common customer questions and give search engines and AI systems more to work with. Consider adding a short FAQ section.' Observed fact, then why it may matter (softly), then a suggestion. Do not skip the middle step.\n- Soften AI/SEO cause-and-effect: prefer 'can help', 'may improve', 'is commonly recommended because', 'often' over 'will', 'needs', 'must', 'has no'. Recommendations are suggestions the owner may consider, not laws.\n- Score these FIVE categories with real numbers 0-100 based strictly on the real data above: Website Health, Google Business Profile, AI Search Visibility, Review Authority, GEO Score. Vary the scores honestly — a business with schema, FAQ, good word count and strong reviews should score well; one missing those should score low. Do NOT give every category a similar number.\n- For Citation Consistency and Social Presence: these are NOT measured yet. Keep score as -1 and comingSoon as true exactly as shown. Give each ONE finding with title 'Coming soon', a short detail explaining full citation/social analysis is being added, status 'warn', and no action. Do not invent a score for these two.\n- overallScore must be the average of ONLY the five real scored categories (ignore the two coming-soon ones).\n- Use the REAL GBP DATA for the Google Business Profile category. Use the REAL WEBSITE DATA for Website Health, AI Search Visibility and GEO Score.\n- FINDINGS COUNT: Give each scored category between 1 and 3 findings — ONLY as many as there are genuinely distinct things to say. Quality over quantity. If a category has only one real thing worth noting, give ONE finding. Do NOT pad a category up to three by rewording the same point or inventing minor filler. A short, sharp report is better than a long repetitive one. Be concrete — reference actual things found or missing.\n- NO REPETITION ACROSS THE WHOLE REPORT: Each finding must raise a DISTINCT issue. If you have already made a point in one category (e.g. 'thin website content' or 'needs more reviews' or 'no schema'), do NOT restate that same point in another category under a different heading. Every finding across all categories must be about a different thing. Before adding a finding, check you have not already said it elsewhere.\n- NO SUMMARY/SYNTHESIS FINDINGS: Do NOT create a finding whose job is to re-explain or combine issues already covered in their own findings (for example, after a schema finding and an FAQ finding, do NOT add a third 'limited structured signals' finding that re-explains schema and FAQ again). Each issue gets ONE finding, explained once.\n- TOP PRIORITY framing: the topPriority field is ONE important opportunity identified from what was actually checked (the homepage and the GBP), NOT a definitive ranking of everything the business should do. The scanner does not check competitors, citations, backlinks, Bing, social, or service pages, so do not phrase it as 'the single most important thing' or imply it outranks everything. Frame it as a high-impact opportunity worth considering.\n- AIM for roughly 8-11 total findings across the five scored categories for a typical business — not 15. Fewer is fine. More than 12 means you are repeating yourself; cut the repeats.\n- EXCEPTION when the website was NOT scannable (REAL WEBSITE DATA section says scanner was blocked or analysis was skipped): Website Health gets exactly 1 finding (the honest 'analysis was skipped' explanation). For AI Search Visibility and GEO Score, AT MOST 1 finding per category may be about the blocked scan; any additional findings MUST draw on real signals you actually have — GBP completeness, rating, review volume, photo count, business category, location — not repeated rewordings of 'we couldn't see the website.' Give fewer findings rather than padding with repetition.\n- For GEO Score: assess how easily ChatGPT or Perplexity could find citable information about this business, based on whether the real website data shows schema markup and FAQ content. Most small businesses score low here because they lack these signals — score honestly, and frame it as an opportunity, not a verdict, since no one can prove exactly how AI tools choose what to cite.\n- If 'IMPORTANT FIX OPPORTUNITY' is mentioned in the GBP data above, you MUST surface it as one of the findings in the Google Business Profile category. Title it 'Website missing from your Google listing', detail it in one short sentence, status 'bad', action: 'Add your website URL to your Google Business Profile dashboard — a free 2-minute fix.'";
  const raw = await callClaude([{role:"user",content:prompt}], 3000);
  const clean = raw.replace(/```json|```/g,"").trim();
  // Helper: attach the matched-business context to the parsed result so the
  // results page can show the user "here is the business we actually scanned"
  // (Glitch #2). gbp may be null when the user said they have no listing.
  function withIdentity(parsed){
    if(parsed && typeof parsed==='object'){
      parsed.gbp = gbp || null;
      parsed.scannedInputs = { bizName, city, website: knownWebsite || null };
      // Fix #3 — trust our deterministic state, not the AI's guess.
      parsed.hasWebsite = !noWebsiteAnywhere;
      parsed.websiteMissingFromGBP = websiteMissingFromGBP;
    }
    return parsed;
  }
  try { return withIdentity(JSON.parse(clean)); }
  catch {
    const s=clean.indexOf("{"), e=clean.lastIndexOf("}");
    if(s!==-1&&e!==-1){try{return withIdentity(JSON.parse(clean.slice(s,e+1)));}catch(e2){}}
    throw new Error("Please try again — the scan occasionally needs a second attempt.");
  }
}

async function chatReply(history, results, bizName) {

function Chat({results,bizName}){
  const [msgs,setMsgs]=useState([{r:"ai",t:"Hi! I just finished checking "+bizName+"'s online footprint. Your biggest opportunity right now: "+results.topPriority+" — want me to walk you through how to address that first?"}]);
  const [input,setInput]=useState("");
  const [busy,setBusy]=useState(false);
  const bottom=useRef(null);
  const msgsRef=useRef(null);
  // Scroll the NEWEST message into view WITHIN the chat's own message box,
  // not by scrolling the whole page. The old approach used
  // scrollIntoView on a bottom marker, which scrolled the entire page so the
  // input box landed in view and pushed the actual answer up above where the
  // user was looking. Scrolling only the inner container keeps the latest
  // reply visible in the chat window without yanking the page around.
  useEffect(()=>{
    const box=msgsRef.current;
    if(box){ box.scrollTop = box.scrollHeight; }
  },[msgs,busy]);

  // CHAT CAP: limit the advisor to MAX_TURNS user messages per session so a
  // single visitor (or bot) can't run up API cost by chatting all day. One
  // "turn" = one user message + its AI reply. The opening AI greeting does
  // not count. After the limit, the input disables and a wrap-up shows.
  const MAX_TURNS=7;
  const userTurns=msgs.filter(m=>m.r==="user").length;
  const limitReached=userTurns>=MAX_TURNS;

  // MESSAGE SIZE CAP: a real question fits easily in a few hundred chars.
  // Capping each message stops someone from pasting a huge blob (e.g. their
  // whole scan) that would cost more to process. 600 is generous for any
  // honest question but blocks expensive pasted payloads. Enforced both on
  // the input (maxLength) and again here before sending, as a belt-and-
  // suspenders guard in case anything bypasses the input limit.
  const MAX_CHARS=600;

  async function send(){
    if(!input.trim()||busy||limitReached)return;
    const txt=input.trim().slice(0,MAX_CHARS);setInput("");
    const next=[...msgs,{r:"user",t:txt}];setMsgs(next);setBusy(true);
    try{
      const history=next.map(m=>({role:m.r==="ai"?"assistant":"user",content:m.t}));
      const reply=await chatReply(history,results,bizName);
      setMsgs(m=>[...m,{r:"ai",t:reply}]);
    }catch{setMsgs(m=>[...m,{r:"ai",t:"Sorry, I hit a snag. Please try again."}]);}
    setBusy(false);
  }

  return(
    <div className="chat">
      <div className="chat-top">
        <div className="chat-ico">🤖</div>
        <h3>AI Footprint Advisor</h3>
        <span className="live"><span className="dot"/>Live</span>
      </div>
      <div className="msgs" ref={msgsRef}>
        {msgs.map((m,i)=><div key={i} className={`msg ${m.r}`}>{m.t}</div>)}
        {busy&&<div className="msg ai thinking">Thinking…</div>}
        {limitReached&&!busy&&<div className="msg ai">We've covered a lot here — that's all this advisor session can cover. For more, run a fresh scan anytime. Good luck out there!</div>}
        <div ref={bottom}/>
      </div>
      <div className="chat-bottom">
        <input className="cinput" value={input} onChange={e=>setInput(e.target.value)}
          onKeyDown={e=>e.key==="Enter"&&send()}
          disabled={limitReached}
          maxLength={MAX_CHARS}
          placeholder={limitReached?"Session limit reached — run a fresh scan for more":"Ask anything about your results…"}/>
        <button className="csend" onClick={send} disabled={!input.trim()||busy||limitReached}>Send</button>
      </div>
    </div>
  );
}

// --- Name-mismatch detector (Fix #8) ---
// Returns true when the business name the owner TYPED has no meaningful
// words in common with the name on the Google listing we matched. Used
// to warn the owner before they confirm the wrong listing — common when
// two businesses share a phone number (entity conflation).
function namesLookDifferent(typed, matched){
  if(!typed||!matched)return false;
  const stop=new Set(["the","of","and","for","llc","inc","co","corp","company","ltd","group","services","service","fl","florida","usa","us"]);
  const toks=s=>s.toLowerCase().replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(w=>w.length>=3&&!stop.has(w));
  const t=new Set(toks(typed));
  const m=new Set(toks(matched));
  if(t.size===0||m.size===0)return false;
  for(const w of t){if(m.has(w))return false;}
  return true;
}

// --- Google URL identifier extractor (Venice-Italy bug fix) ---
// Pulls a real Place ID out of a pasted Google URL when one is present.
// Most Google share links DO NOT include a Place ID (they use Knowledge
// Graph IDs or data IDs instead, which can't be deterministically converted
// to a Place ID). When no Place ID is found we refuse to scan that URL
// and route the user to the manual paste path instead — that's what
// prevents the tool from falling back to a text search and returning the
// wrong country / wrong business.
function extractGoogleUrlIds(url){
  if(!url)return{placeId:null,bizName:null};
  let d=url;
  try{d=decodeURIComponent(url);}catch{}
  const placeId =
    d.match(/place_id:([A-Za-z0-9_-]+)/)?.[1] ||
    d.match(/[?&]query_place_id=([^&]+)/)?.[1] ||
    d.match(/[?&]placeid=([A-Za-z0-9_-]+)/)?.[1] ||
    null;
  // Try to recover the business name from the URL so we can pre-fill the
  // manual paste form when the link itself isn't usable. Two common spots:
  // ?q=Business+Name  and  /maps/place/Business+Name/...
  let bizName = null;
  const q = d.match(/[?&]q=([^&]+)/)?.[1];
  if(q){
    bizName = q.replace(/\+/g," ").trim();
  } else {
    const pm = d.match(/\/maps\/place\/([^\/\?]+)/);
    if(pm) bizName = pm[1].replace(/\+/g," ").replace(/-/g," ").trim();
  }
  return {placeId, bizName};
}

// --- Google Place Autocomplete widget, wrapped as a React component ---
// Mounts Google's autocomplete on an input. When the user picks a
// business from the dropdown, calls onPick with {placeId, name, address}.
function BusinessAutocomplete({ onPick }) {
  const inputRef = useRef(null);
  const mountedRef = useRef(false);
  const [status, setStatus] = useState("loading"); // loading | ready | failed

  useEffect(() => {
    // Wait for Google's library to be available, then mount once.
    let tries = 0;
    const tryMount = () => {
      if (mountedRef.current) return;
      if (window.google && window.google.maps && window.google.maps.places && inputRef.current) {
        mountedRef.current = true;
        const ac = new window.google.maps.places.Autocomplete(inputRef.current, {
          types: ["establishment"],
          fields: ["place_id", "name", "formatted_address"],
          // Fix #4 — bias predictions toward Florida so local businesses
          // rank higher and stop dropping off the list as the owner types.
          // Soft bias (strictBounds:false by default) — businesses outside
          // Florida still appear if the owner types them clearly.
          bounds: new window.google.maps.LatLngBounds(
            new window.google.maps.LatLng(24.396308, -87.634938),
            new window.google.maps.LatLng(31.000888, -79.974306)
          ),
        });
        ac.addListener("place_changed", () => {
          const place = ac.getPlace();
          if (place && place.place_id) {
            onPick({
              placeId: place.place_id,
              name: place.name || "",
              address: place.formatted_address || "",
            });
          }
        });
        setStatus("ready");
        return;
      }
      tries++;
      if (tries > 40) { setStatus("failed"); return; } // ~10s of waiting
      setTimeout(tryMount, 250);
    };
    tryMount();
  }, []);

  return (
    <div>
      <input ref={inputRef} type="text"
        placeholder="Start typing your business name..."
        style={{width:"100%",padding:"12px 14px",fontSize:"1rem",
          border:"1px solid rgba(255,255,255,0.2)",borderRadius:8,
          background:"rgba(0,0,0,0.04)",color:"inherit",boxSizing:"border-box"}} />
      {status==="failed" && (
        <div className="err" style={{marginTop:8,fontSize:"0.85rem"}}>
          The business search could not load. Please use one of the options below instead.
        </div>
      )}
    </div>
  );
}

// the user's emotional state (😐 okay / 😞 frustrating).
function BugReport({open,setOpen,mood,setMood,onSubmitted}){
  const [showHowto,setShowHowto]=useState(false);
  const [text,setText]=useState("");
  const [file,setFile]=useState(null);
  const [email,setEmail]=useState("");
  const [state,setState]=useState("idle"); // idle | sending | sent | error
  const [errMsg,setErrMsg]=useState("");

  // Copy varies depending on what triggered the modal.
  const copy = mood==="frustrating" ? {
    title:"Sorry that was frustrating",
    intro:"I want to fix this. Tell me what felt frustrating and I'll work on it — quick and casual is fine.",
    msgLabel:"What's frustrating?",
    placeholder:"Tell me what felt wrong or annoying…"
  } : mood==="okay" ? {
    title:"Tell me what's missing",
    intro:"You're testing this with me — that's the help I need. What felt incomplete, off, or could be better? Quick and casual is fine.",
    msgLabel:"What's missing or could be better?",
    placeholder:"Tell me what felt incomplete or could be improved…"
  } : {
    title:"Spotted something off?",
    intro:"You're testing this with me — that's the help I need. Tell me what looked wrong, weird, or confusing, and I'll fix it. Quick and casual is fine.",
    msgLabel:"What happened?",
    placeholder:"Just describe it in your own words…"

    setOpen(false);
    // Clear the form state shortly after the modal closes so it's fresh
    // next time the link is clicked.
    setTimeout(()=>{
      setText("");setFile(null);setEmail("");
      setState("idle");setErrMsg("");
      if(setMood)setMood(null);

  async function submit(){
    if(!text.trim()){

      setState("error");
      return;
    }
    setState("sending");setErrMsg("");
    try{
      const fd=new FormData();
      fd.append("message",text.trim());
      fd.append("mood",mood||"bug-report");
      if(email.trim())fd.append("email",email.trim());

        setErrMsg((d&&d.error)||"Couldn't send. Please try again.");
        setState("error");

      setErrMsg("Couldn't send. Check your internet and try again.");
      setState("error");

              </div>
            ) : (
              <>
                <button className="bug-close" onClick={close} aria-label="Close">×</button>
                <h3>{copy.title}</h3>
                <p>{copy.intro}</p>
                <label>{copy.msgLabel}</label>
                <textarea value={text} onChange={e=>setText(e.target.value)}
                  placeholder={copy.placeholder}
                  disabled={state==="sending"} />
                <label>Screenshot (optional but encouraged)</label>
                <div className="bug-file-wrap">
                  <input type="file" accept="image/*" id="bug-file"
                    onChange={e=>setFile(e.target.files[0]||null)}
                    disabled={state==="sending"} />
                  <label htmlFor="bug-file" className="bug-file-btn">
