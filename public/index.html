  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{

    .badge{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--cyan);background:rgba(0,212,255,0.08);border:1px solid rgba(0,212,255,0.2);border-radius:100px;padding:3px 10px}

    .dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 2s infinite;display:inline-block}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}

    .grad{background:linear-gradient(135deg,var(--cyan) 0%,var(--purple) 55%,var(--green) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .sub{font-size:1rem;color:var(--t2);max-width:500px;margin:0 auto 40px;line-height:1.75;font-weight:300}
    .card{background:var(--s1);border:1px solid var(--b1);border-radius:20px;padding:32px;max-width:560px;margin:0 auto;position:relative;overflow:hidden}
    .card::before{content:'';position:absolute;top:-1px;left:20%;right:20%;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),var(--purple),transparent)}
    .field{margin-bottom:14px}
    .field label{display:block;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--t2);margin-bottom:7px}

    .aff-wrap{margin-bottom:16px}
    .section-label{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--t2);margin-bottom:11px;padding-left:2px}
    .aff-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:11px}
    .aff{background:var(--s1);border:1px solid var(--b1);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:9px;transition:border-color 0.2s,transform 0.15s}
    .aff:hover{border-color:rgba(0,212,255,0.2);transform:translateY(-2px)}
    .aff-ico{font-size:20px}
    .aff h4{font-family:var(--fh);font-size:0.85rem;font-weight:700}
    .aff p{font-size:0.76rem;color:var(--t2);line-height:1.6;flex:1}
    .aff a{display:block;padding:8px 12px;background:rgba(0,212,255,0.07);border:1px solid rgba(0,212,255,0.18);border-radius:7px;color:var(--cyan);font-size:0.76rem;font-weight:600;text-decoration:none;text-align:center}
    .aff-note{font-size:0.66rem;color:var(--t3)}
    .chat{background:var(--s1);border:1px solid var(--b1);border-radius:16px;overflow:hidden;margin-bottom:16px}
    .chat-top{padding:16px 20px;border-bottom:1px solid var(--b1);display:flex;align-items:center;gap:11px}
    .chat-ico{width:34px;height:34px;border-radius:8px;background:rgba(0,212,255,0.1);display:flex;align-items:center;justify-content:center;font-size:15px}
    .chat-top h3{font-family:var(--fh);font-size:0.9rem;font-weight:700}

    .cinput{flex:1;background:var(--s2);border:1px solid var(--b1);border-radius:7px;padding:10px 13px;color:var(--t1);font-family:var(--fb);font-size:0.85rem;outline:none}
    .cinput:focus{border-color:rgba(0,212,255,0.3)}
    .cinput::placeholder{color:var(--t3)}
    .csend{padding:10px 16px;background:var(--cyan);border:none;border-radius:7px;color:#000;font-weight:700;font-size:0.82rem;cursor:pointer}
    .csend:disabled{opacity:0.35;cursor:not-allowed}
    .gate{background:var(--s1);border:1px solid var(--b1);border-radius:16px;padding:28px;text-align:center;margin-bottom:16px}
    .gate h3{font-family:var(--fh);font-size:1.1rem;font-weight:700;margin-bottom:7px}
    .gate p{color:var(--t2);font-size:0.85rem;line-height:1.7;margin-bottom:18px;max-width:380px;margin-left:auto;margin-right:auto}
    .gbtn{padding:13px 26px;background:linear-gradient(135deg,var(--cyan),#009abb);border:none;border-radius:8px;color:#000;font-family:var(--fh);font-size:0.9rem;font-weight:700;cursor:pointer}
    .gprice{font-size:0.75rem;color:var(--t3);margin-top:9px}
    .good{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}
    .good-bg{background:rgba(16,185,129,0.1)}.warn-bg{background:rgba(245,158,11,0.1)}.bad-bg{background:rgba(239,68,68,0.1)}
    .good-d{background:var(--green)}.warn-d{background:var(--amber)}.bad-d{background:var(--red)}
    .good-b{background:var(--green)}.warn-b{background:var(--amber)}.bad-b{background:var(--red)}
    .good-g{background:rgba(16,185,129,0.1);color:var(--green);border:1px solid rgba(16,185,129,0.25)}
    .warn-g{background:rgba(245,158,11,0.1);color:var(--amber);border:1px solid rgba(245,158,11,0.25)}
    .bad-g{background:rgba(239,68,68,0.1);color:var(--red);border:1px solid rgba(239,68,68,0.25)}
    .rescan{display:block;margin:24px auto 0;padding:11px 26px;background:transparent;border:1px solid var(--b1);border-radius:8px;color:var(--t2);font-family:var(--fb);font-size:0.86rem;cursor:pointer}
    .rescan:hover{border-color:var(--cyan);color:var(--cyan)}
    .err{max-width:520px;margin:40px auto;padding:18px 22px;background:rgba(239,68,68,0.07);border:1px solid rgba(239,68,68,0.2);border-radius:12px;color:#fca5a5;font-size:0.86rem;line-height:1.65;text-align:center}
    .pad{padding:0 20px}
    @media(max-width:500px){.nav{padding:14px 18px}.hero{padding:36px 18px 28px}.card,.shero{padding:22px 18px}.results{padding:20px 14px 60px}}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

const HEADERS = {
  "Content-Type": "application/json"
};

const AFF = {
  domain: (n) => `https://www.godaddy.com/domainsearch/find?checkAvail=1&domainToCheck=${encodeURIComponent(n.toLowerCase().replace(/\s+/g,""))}&utm_source=presenceiq&utm_medium=referral`,
  hosting: () => `https://www.godaddy.com/hosting/web-hosting?utm_source=presenceiq&utm_medium=referral`,
  workspace: () => `https://workspace.google.com/?utm_source=presenceiq&utm_medium=referral`,
  gbp: () => `https://business.google.com/create?utm_source=presenceiq`,
};

async function callClaude(messages, maxTokens=3000) {
  const res = await fetch("/api/scan", {
    method:"POST", headers:HEADERS,
    body:JSON.stringify({model:"claude-sonnet-4-20250514", max_tokens:maxTokens, messages})
  });
  if(!res.ok){const t=await res.text();throw new Error("API "+res.status+": "+t.slice(0,200));}
  const d=await res.json();
  return d.content.map(b=>b.text||"").join("");
}

async function getGBPData(bizName, city) {
  try {
    const res = await fetch("/api/places", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({bizName, city})
    });
    if (!res.ok) return null;
    const data = await res.json();
    return data.found ? data : null;
  } catch { return null; }
}

async function getSiteData(website) {
  try {
    const res = await fetch("/api/fetchsite", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ website })
    });
    if (!res.ok) return null;
    return await res.json();
  } catch { return null; }
}

async function runScan(bizName, website, city) {
  // Fetch real GBP data AND real website data first
  const gbp = await getGBPData(bizName, city);
  const site = await getSiteData(website);
  
  const gbpContext = gbp ? `
REAL GOOGLE BUSINESS PROFILE DATA (use this for GBP category — do not guess):
- GBP Found: Yes
- Business Name on Google: ${gbp.name}
- Star Rating: ${gbp.rating || 'No rating yet'}
- Total Reviews: ${gbp.reviewCount}
- Address: ${gbp.address || 'Not listed'}
- Phone: ${gbp.phone || 'Not listed'}
- Website on GBP: ${gbp.website || 'None'}
- Has Business Hours Set: ${gbp.hasHours ? 'Yes' : 'No'}
- Photo Count: ${gbp.photoCount}
- Business Status: ${gbp.businessStatus || 'Unknown'}
` : `
REAL GOOGLE BUSINESS PROFILE DATA: No GBP listing found for this business. Score GBP category very low.
`;

  const siteContext = (site && site.fetched) ? `
REAL WEBSITE DATA (use this for Website Health, AI Search Visibility, and GEO Score — do not guess):
- Website reachable: Yes
- Page title: ${site.title || '(none found)'}
- Meta description: ${site.metaDescription || '(none found)'}
- Has structured data / schema markup: ${site.hasSchema ? 'Yes' : 'No'}
- Mobile viewport tag present: ${site.hasViewport ? 'Yes' : 'No'}
- H1 headings: ${site.h1Count}, H2 headings: ${site.h2Count}
- Has FAQ content: ${site.hasFAQ ? 'Yes' : 'No'}
- Links to Facebook: ${site.hasFacebook ? 'Yes' : 'No'}, Links to Instagram: ${site.hasInstagram ? 'Yes' : 'No'}
- Approx word count on homepage: ${site.wordCount}
- Text sample from homepage: ${site.textSample || '(none)'}
` : `
REAL WEBSITE DATA: The website could not be analyzed (no website given, or the site blocked automated access). For Website Health, score low and note in the findings that the website could not be reached for analysis.
`;

  const prompt = "You are auditing a local business's online presence. Use ONLY the real data provided below. Do NOT invent facts. Return ONLY valid JSON, no other text.\n\nBusiness: "+bizName+"\nWebsite: "+(website||"none")+"\nCity: "+city+"\n\n"+gbpContext+"\n"+siteContext+"\n\nReturn this JSON:\n{\"overallScore\":50,\"overallGrade\":\"Needs Work\",\"summary\":\"2 sentence summary\",\"topPriority\":\"top action\",\"hasWebsite\":false,\"categories\":[{\"name\":\"Website Health\",\"subtitle\":\"SEO and mobile\",\"icon\":\"🌐\",\"score\":50,\"findings\":[{\"title\":\"finding\",\"detail\":\"detail\",\"status\":\"warn\",\"action\":\"action\"}]},{\"name\":\"Google Business Profile\",\"subtitle\":\"Local ranking power\",\"icon\":\"📍\",\"score\":50,\"findings\":[]},{\"name\":\"AI Search Visibility\",\"subtitle\":\"ChatGPT and Google AI\",\"icon\":\"🤖\",\"score\":50,\"findings\":[]},{\"name\":\"Citation Consistency\",\"subtitle\":\"NAP across the web\",\"icon\":\"📋\",\"score\":-1,\"comingSoon\":true,\"findings\":[]},{\"name\":\"Social Presence\",\"subtitle\":\"Facebook and Instagram\",\"icon\":\"📱\",\"score\":-1,\"comingSoon\":true,\"findings\":[]},{\"name\":\"Review Authority\",\"subtitle\":\"Volume and recency\",\"icon\":\"⭐\",\"score\":50,\"findings\":[]},{\"name\":\"GEO Score\",\"subtitle\":\"AI search trust and authority\",\"icon\":\"🧠\",\"score\":50,\"findings\":[]}]}\n\nSCORING RULES:\n- Score these FIVE categories with real numbers 0-100 based strictly on the real data above: Website Health, Google Business Profile, AI Search Visibility, Review Authority, GEO Score. Vary the scores honestly — a business with schema, FAQ, good word count and strong reviews should score well; one missing those should score low. Do NOT give every category a similar number.\n- For Citation Consistency and Social Presence: these are NOT measured yet. Keep score as -1 and comingSoon as true exactly as shown. Give each ONE finding with title 'Coming soon', a short detail explaining full citation/social analysis is being added, status 'warn', and no action. Do not invent a score for these two.\n- overallScore must be the average of ONLY the five real scored categories (ignore the two coming-soon ones).\n- Use the REAL GBP DATA for the Google Business Profile category. Use the REAL WEBSITE DATA for Website Health, AI Search Visibility and GEO Score.\n- Each of the five scored categories needs exactly 3 specific findings based on the real data. Be concrete — reference actual things found or missing.\n- For GEO Score: assess whether ChatGPT or Perplexity would recommend this business, based on whether the real website data shows schema markup and FAQ content AI can cite. Score harshly — most small businesses score under 35 on GEO.";
  const raw = await callClaude([{role:"user",content:prompt}], 3000);
  const clean = raw.replace(/```json|```/g,"").trim();
  try { return JSON.parse(clean); }
  catch {
    const s=clean.indexOf("{"), e=clean.lastIndexOf("}");
    if(s!==-1&&e!==-1){try{return JSON.parse(clean.slice(s,e+1));}catch(e2){}}
    throw new Error("Please try again — the scan occasionally needs a second attempt.");
  }
}

async function chatReply(history, results, bizName) {
  const sys = "You are the PresenceIQ AI Advisor helping "+bizName+" improve their online presence. Score: "+results.overallScore+"/100. Top priority: "+results.topPriority+". Write like talking to a busy tradesperson. Plain English only. 2-3 short paragraphs max. End with one clear next action.";
  const msgs = [{role:"user",content:sys+"\n\nConversation:"},{role:"assistant",content:"Ready to help."},...history];
  return await callClaude(msgs, 500);
}

const STEPS=["Fetching website signals…","Analyzing SEO structure…","Checking Google Business Profile…","Scoring AI search visibility…","Scanning citation consistency…","Reviewing social presence…","Assessing review authority…","Building your action plan…"];

function Ring({score,c}){
  const r=52,circ=2*Math.PI*r;
  const col=c==="good"?"#10b981":c==="warn"?"#f59e0b":"#ef4444";
  return(
    <div className="ring">
      <svg width="120" height="120" viewBox="0 0 120 120">
        <circle cx="60" cy="60" r={r} fill="none" stroke="#1e2d45" strokeWidth="9"/>
        <circle cx="60" cy="60" r={r} fill="none" stroke={col} strokeWidth="9"
          strokeLinecap="round" strokeDasharray={circ} strokeDashoffset={circ-(score/100)*circ}
          style={{filter:`drop-shadow(0 0 7px ${col}55)`,transition:"stroke-dashoffset 1.4s"}}/>
      </svg>
      <div className="rnum" style={{color:col}}>{score}<div className="rlbl">/ 100</div></div>
    </div>
  );
}

function CatCard({cat}){
  const [open,setOpen]=useState(true);
  const soon=cat.comingSoon||cat.score<0;
  const c=soon?"warn":(cat.score>=70?"good":cat.score>=40?"warn":"bad");
  return(
    <div className="cat">
      <div className="chead" onClick={()=>setOpen(o=>!o)}>
        <div className={`cico ${c}-bg`}>{cat.icon}</div>
        <div className="cmeta"><h3>{cat.name}</h3><span>{cat.subtitle}</span></div>
        <div className="cright">
          {soon?(
            <span className={`cpct warn`} style={{fontSize:"0.7rem",fontWeight:700}}>Coming soon</span>
          ):(
            <>
              <div className="bw"><div className={`bf ${c}-b`} style={{width:cat.score+"%"}}/></div>
              <span className={`cpct ${c}`}>{cat.score}%</span>
            </>
          )}
          <span className={`chev ${open?"open":""}`}>▼</span>
        </div>
      </div>
      <div className={`cbody ${open?"":"shut"}`}>
        {cat.findings.map((f,i)=>{
          const fc=f.status==="good"?"good":f.status==="warn"?"warn":"bad";
          return(
            <div key={i} className="finding">
              <div className={`fd ${fc}-d`}/>
              <div className="ft">
                <h4 className={fc}>{f.title}</h4>
                <p>{f.detail}</p>
                {f.action&&<div className="faction">{f.action}</div>}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function AffCards({results,bizName}){
  const cards=[];
  if(!results.hasWebsite){
    cards.push({ico:"🌐",title:"Claim Your Domain",desc:"Every business needs a web address. Search for yours before someone else takes it.",label:"Search Domains →",href:AFF.domain(bizName),note:"From ~$12/yr via GoDaddy"});
    cards.push({ico:"🖥️",title:"Get Web Hosting",desc:"Once you have a domain you need a home for your website.",label:"View Hosting →",href:AFF.hosting(),note:"From ~$6/mo"});
  }
  const gbp=results.categories?.find(c=>c.name==="Google Business Profile");
  if(gbp&&gbp.score<65)cards.push({ico:"📍",title:"Claim Google Listing",desc:"Your Google Business Profile is your most powerful free marketing tool.",label:"Claim Free →",href:AFF.gbp(),note:"Free — takes about 10 minutes"});
  cards.push({ico:"📧",title:"Professional Email",desc:"joe@gmail.com loses customers. joe@joesplumbing.com wins them.",label:"Get Business Email →",href:AFF.workspace(),note:"Google Workspace from $6/user/mo"});
  return(
    <div className="aff-wrap">
      <div className="section-label">Recommended Next Steps</div>
      <div className="aff-grid">
        {cards.map((card,i)=>(
          <div key={i} className="aff">
            <div className="aff-ico">{card.ico}</div>
            <h4>{card.title}</h4>
            <p>{card.desc}</p>
            <a href={card.href} target="_blank" rel="noopener noreferrer">{card.label}</a>
            <div className="aff-note">{card.note}</div>
          </div>
        ))}
      </div>
    </div>
  );
}


function AlgorithmFeed({bizType, city}) {
  const [news, setNews] = React.useState(null);
  const [loading, setLoading] = React.useState(false);

  React.useEffect(() => {
    async function fetchNews() {
      setLoading(true);
      try {
        const prompt = "You are a local SEO and AI search expert. List the 3 most important recent changes to Google local search and AI search visibility (ChatGPT, Perplexity, Google AI) affecting a " + bizType + " business in " + city + ". Plain English only. Format as JSON array: [{title, change, action}]. Return only valid JSON.";
        const res = await fetch("/api/scan", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:600,messages:[{role:"user",content:prompt}]})
        });
        const data = await res.json();
        const text = data.content.map(b => b.text || "").join("");
        const clean = text.replace(/```json|```/g,"").trim();
        setNews(JSON.parse(clean));
      } catch(e) { setNews(null); }
      setLoading(false);
    }
    fetchNews();
  }, []);

  if(loading) return (
    <div style={{background:"var(--s1)",border:"1px solid var(--b1)",borderRadius:16,padding:20,marginBottom:16}}>
      <div style={{fontSize:"0.8rem",color:"var(--t2)"}}>Loading algorithm updates...</div>
    </div>
  );
  if(!news) return null;

  return (
    <div style={{background:"var(--s1)",border:"1px solid rgba(124,58,237,0.3)",borderRadius:16,overflow:"hidden",marginBottom:16}}>
      <div style={{padding:"14px 20px",borderBottom:"1px solid var(--b1)",display:"flex",alignItems:"center",gap:10,background:"rgba(124,58,237,0.05)"}}>
        <span style={{fontSize:16}}>{"\u26a1"}</span>
        <div>
          <div style={{fontFamily:"var(--fh)",fontSize:"0.9rem",fontWeight:700}}>What Changed This Month</div>
          <div style={{fontSize:"0.72rem",color:"var(--t2)"}}>Latest algorithm updates affecting your business</div>
        </div>
        <span style={{marginLeft:"auto",fontSize:"0.68rem",color:"#7c3aed",background:"rgba(124,58,237,0.1)",border:"1px solid rgba(124,58,237,0.2)",borderRadius:100,padding:"2px 8px",fontWeight:700}}>LIVE</span>
      </div>
      <div style={{padding:"4px 20px 16px"}}>
        {news.map((item,i) => (
          <div key={i} style={{padding:"12px 0",borderBottom:i<news.length-1?"1px solid rgba(30,45,69,0.35)":"none"}}>
            <div style={{fontFamily:"var(--fh)",fontSize:"0.85rem",fontWeight:700,marginBottom:4,color:"var(--cyan)"}}>{item.title}</div>
            <div style={{fontSize:"0.78rem",color:"var(--t2)",lineHeight:1.65,marginBottom:6}}>{item.change}</div>
            <div style={{fontSize:"0.76rem",color:"var(--green)",lineHeight:1.55}}>{"\u2192"} {item.action}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

function Chat({results,bizName}){
  const [msgs,setMsgs]=useState([{r:"ai",t:"Hi! I just finished scanning "+bizName+". Your biggest win right now: "+results.topPriority+" — want me to walk you through exactly how to fix that first?"}]);
  const [input,setInput]=useState("");
  const [busy,setBusy]=useState(false);
  const bottom=useRef(null);
  useEffect(()=>{bottom.current?.scrollIntoView({behavior:"smooth"});},[msgs]);

  async function send(){
    if(!input.trim()||busy)return;
    const txt=input.trim();setInput("");
    const next=[...msgs,{r:"user",t:txt}];setMsgs(next);setBusy(true);
    try{
      const history=next.map(m=>({role:m.r==="ai"?"assistant":"user",content:m.t}));
      const reply=await chatReply(history,results,bizName);
      setMsgs(m=>[...m,{r:"ai",t:reply}]);
    }catch{setMsgs(m=>[...m,{r:"ai",t:"Sorry, I hit a snag. Please try again."}]);}
    setBusy(false);
  }

  return(
    <div className="chat">
      <div className="chat-top">
        <div className="chat-ico">🤖</div>
        <h3>AI Presence Advisor</h3>
        <span className="live"><span className="dot"/>Live</span>
      </div>
      <div className="msgs">
        {msgs.map((m,i)=><div key={i} className={`msg ${m.r}`}>{m.t}</div>)}
        {busy&&<div className="msg ai thinking">Thinking…</div>}
        <div ref={bottom}/>
      </div>
      <div className="chat-bottom">
        <input className="cinput" value={input} onChange={e=>setInput(e.target.value)}
          onKeyDown={e=>e.key==="Enter"&&send()} placeholder="Ask anything about your results…"/>
        <button className="csend" onClick={send} disabled={!input.trim()||busy}>Send</button>
      </div>
    </div>
  );
}

function App(){
  const [view,setView]=useState("form");
  const [bizName,setBizName]=useState("");
  const [website,setWebsite]=useState("");
  const [city,setCity]=useState("");
  const [email,setEmail]=useState("");
  const [stepIdx,setStepIdx]=useState(0);
  const [results,setResults]=useState(null);
  const [errMsg,setErrMsg]=useState("");

  useEffect(()=>{
    if(view!=="loading")return;
    let i=0;
    const iv=setInterval(()=>{i++;setStepIdx(i);if(i>=STEPS.length)clearInterval(iv);},750);
    return()=>clearInterval(iv);
  },[view]);

  async function handleScan(){
    if(!bizName.trim()||!city.trim())return;
    setView("loading");setStepIdx(0);
    if(email.trim()){
      fetch("/api/subscribe",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email.trim()})}).catch(()=>{});
    }
    try{
      const data=await runScan(bizName,website,city);
      setResults(data);setView("results");
    }catch(e){setErrMsg(e.message);setView("error");}
  }

  function reset(){setView("form");setResults(null);setErrMsg("");}
  const sc=results?(results.overallScore>=70?"good":results.overallScore>=40?"warn":"bad"):"warn";

  return(
    <div className="wrap">
      <nav className="nav">
        <div className="logo">PresenceIQ</div>
        <span className="badge">Beta</span>
      </nav>

      {view==="form"&&(
        <div className="hero">
          <div className="eyebrow"><span className="dot"/>AI-Powered Presence Scanner</div>
          <h1>Is Your Business<br/><span className="grad">Invisible to AI?</span></h1>
          <p className="sub">AI search has changed everything. When someone asks ChatGPT or Google AI to recommend a local business, does yours appear? Find out in 30 seconds — free.</p>
          <div className="card">
            <div className="field"><label>Business Name *</label>
              <input value={bizName} onChange={e=>setBizName(e.target.value)} placeholder="e.g. Joe's Plumbing & Drain"/></div>
            <div className="field"><label>Website URL <span style={{opacity:0.45,fontWeight:400,textTransform:"none",letterSpacing:0}}>(if you have one)</span></label>
              <input value={website} onChange={e=>setWebsite(e.target.value)} placeholder="e.g. https://joesplumbing.com"/></div>
            <div className="field"><label>City & State *</label>
              <input value={city} onChange={e=>setCity(e.target.value)} placeholder="e.g. Venice, FL"/></div>
            <div className="field"><label>Email Address</label>
              <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="e.g. joe@joesplumbing.com"/>
              <div className="enote">We'll send your full report here. No spam, ever.</div></div>
            <button className="sbtn" onClick={handleScan} disabled={!bizName.trim()||!city.trim()}>
              Run My Free Presence Scan
              <small>Takes about 30 seconds · No credit card needed</small>
            </button>
          </div>
        </div>
      )}

      {view==="loading"&&(
        <div className="loading">
          <div className="spinner"/>
          <h3>Scanning {bizName}…</h3>
          <p>Checking your presence across Google, AI search, social media, and directories</p>
          <ul className="steps">
            {STEPS.map((s,i)=>(
              <li key={i} className={i<stepIdx?"ok":i===stepIdx?"on":""}>
                <span style={{width:18,textAlign:"center",fontSize:12}}>{i<stepIdx?"✓":i===stepIdx?"◉":"○"}</span>{s}
              </li>
            ))}
          </ul>
        </div>
      )}

      {view==="error"&&(
        <div className="pad">
          <div className="err">{errMsg}</div>
          <button className="rescan" onClick={reset}>← Try Again</button>
        </div>
      )}

      {view==="results"&&results&&(
        <div className="results">
          <div className="shero">
            <Ring score={results.overallScore} c={sc}/>
            <div className="sinfo">
              <div className={`gpill ${sc}-g`}>{results.overallGrade}</div>
              <h2>Presence Report: {bizName}</h2>
              <p>{results.summary}</p>
              <div className="priority"><strong>Top Priority</strong>{results.topPriority}</div>
            </div>
          </div>
          <Chat results={results} bizName={bizName}/>
          <AlgorithmFeed bizType={results.categories?.[0]?.findings?.[0]?.title || bizName} city={city}/>
          <AffCards results={results} bizName={bizName}/>
          <div className="cats">{results.categories?.map((cat,i)=><CatCard key={i} cat={cat}/>)}</div>
          <button className="rescan" onClick={reset}>← Scan Another Business</button>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
